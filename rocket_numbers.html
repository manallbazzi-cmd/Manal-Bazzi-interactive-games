<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocket Numbers! Grade 1 Math Game</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Comic Neue"', 'cursive', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#4DB8FF',
                            yellow: '#FFD166',
                            red: '#EF476F',
                            green: '#06D6A0',
                            dark: '#073B4C'
                        }
                    },
                    boxShadow: {
                        'bubbly': '0 8px 0 rgba(0, 0, 0, 0.15)',
                        'bubbly-active': '0 2px 0 rgba(0, 0, 0, 0.15)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(180deg, #1A2A6C 0%, #112D4E 50%, #3F72AF 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            touch-action: manipulation; /* Prevents double-tap zoom on mobile */
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes pulse-star {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .star-pulse {
            animation: pulse-star 1.5s infinite;
        }

        /* Button interactions */
        .game-btn {
            transition: all 0.1s ease;
        }
        .game-btn:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.15);
        }

        /* Confetti */
        #confetti-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 md:p-8">

    <canvas id="confetti-layer"></canvas>

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen" class="max-w-2xl w-full text-center pop-in z-10 bg-white/10 backdrop-blur-md p-8 md:p-12 rounded-[3rem] border-4 border-brand-yellow shadow-2xl mt-10">
        <div class="text-7xl mb-6 animate-float">🚀👾</div>
        <h1 class="text-5xl md:text-7xl font-black text-brand-yellow mb-4 drop-shadow-lg leading-tight">
            Rocket<br>Numbers!
        </h1>
        <p class="text-2xl md:text-3xl text-blue-100 mb-8 font-bold">
            Learn numbers up to 79!
        </p>
        
        <div class="bg-brand-dark/40 rounded-3xl p-6 mb-8 border-2 border-brand-blue">
            <h3 class="text-2xl font-bold text-brand-green mb-3">What we will practice:</h3>
            <ul class="text-xl text-left inline-block space-y-2 text-white">
                <li>✨ Digits (like <span class="font-black text-brand-yellow">45</span>)</li>
                <li>📖 Words (like <span class="font-black text-brand-yellow">forty-five</span>)</li>
                <li>➕ Expanded Form (like <span class="font-black text-brand-yellow">40 + 5</span>)</li>
            </ul>
        </div>

        <button onclick="startGame()" class="game-btn bg-brand-green text-brand-dark text-4xl font-black py-5 px-12 rounded-[2rem] shadow-bubbly hover:bg-[#05c493] w-full md:w-auto">
            PLAY NOW! 🎮
        </button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden max-w-4xl w-full flex-col items-center z-10 w-full mt-4">
        
        <!-- Header / Progress -->
        <div class="w-full flex justify-between items-center mb-8 bg-white/10 backdrop-blur-sm p-4 md:p-6 rounded-3xl border-2 border-white/20">
            <div class="text-2xl md:text-3xl font-bold text-brand-yellow flex items-center gap-2">
                <span class="text-4xl">⭐</span> <span id="score-display">0</span>
            </div>
            <div class="text-2xl md:text-3xl font-bold text-white bg-brand-dark/50 px-6 py-2 rounded-full">
                <span id="question-counter">1</span> / 10
            </div>
        </div>

        <!-- Question Area -->
        <div class="w-full bg-white rounded-[3rem] p-8 md:p-12 text-center shadow-2xl border-b-8 border-brand-blue relative">
            
            <!-- Character giving instructions -->
            <div id="character-icon" class="absolute -top-12 left-1/2 transform -translate-x-1/2 text-7xl animate-float">
                🤖
            </div>

            <h2 id="instruction-text" class="text-3xl md:text-4xl font-black text-brand-dark mt-6 mb-6">
                Match the number!
            </h2>

            <!-- The Target to Match -->
            <div class="bg-blue-50 border-4 border-brand-blue rounded-3xl py-10 px-4 mb-8 relative overflow-hidden">
                <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#4DB8FF 2px, transparent 2px); background-size: 20px 20px;"></div>
                <div id="target-display" class="text-6xl md:text-8xl font-black text-brand-red relative z-10 drop-shadow-md">
                    --
                </div>
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 w-full">
                <!-- Buttons will be injected here -->
            </div>
            
            <!-- Feedback Message -->
            <div id="feedback-msg" class="h-16 mt-6 flex items-center justify-center text-3xl font-bold rounded-2xl transition-all opacity-0">
                Correct! 🎉
            </div>
        </div>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="results-screen" class="hidden max-w-2xl w-full text-center pop-in z-10 bg-white p-8 md:p-12 rounded-[3rem] border-8 border-brand-yellow shadow-2xl mt-10">
        <div class="text-7xl mb-4 star-pulse">🏆</div>
        <h2 class="text-5xl md:text-6xl font-black text-brand-dark mb-4">
            Mission Complete!
        </h2>
        <p class="text-3xl font-bold text-gray-600 mb-6">
            You are a Number Master!
        </p>
        
        <div class="bg-brand-blue/20 rounded-3xl p-8 mb-8">
            <div class="text-2xl text-brand-dark font-bold mb-2">Final Score</div>
            <div class="text-7xl font-black text-brand-red">
                <span id="final-score">10</span>/10
            </div>
            <div id="perfect-badge" class="hidden mt-4 text-2xl font-bold text-brand-green bg-green-100 py-2 px-4 rounded-full inline-block">
                🌟 PERFECT SCORE! 🌟
            </div>
        </div>

        <button onclick="resetGame()" class="game-btn bg-brand-yellow text-brand-dark text-3xl font-black py-4 px-10 rounded-[2rem] shadow-bubbly hover:bg-[#ffc640] w-full md:w-auto">
            PLAY AGAIN 🔄
        </button>
    </div>

    <script>
        // --- 1. NUMBER TO WORDS DICTIONARY (UP TO 79) ---
        const ones = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 
                      'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
        const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy'];

        function numberToWords(num) {
            if (num < 20) return ones[num];
            let digitOnes = num % 10;
            let digitTens = Math.floor(num / 10);
            if (digitOnes === 0) {
                return tens[digitTens];
            } else {
                return tens[digitTens] + '-' + ones[digitOnes];
            }
        }

        function getExpandedForm(num) {
            if (num < 10) return `${num}`;
            let tensVal = Math.floor(num / 10) * 10;
            let onesVal = num % 10;
            return `${tensVal} + ${onesVal}`;
        }

        // --- 2. GAME STATE ---
        let currentQuestion = 1;
        const totalQuestions = 10;
        let score = 0;
        let currentCorrectAnswer = null;
        let isProcessing = false;

        // DOM Elements
        const screens = {
            welcome: document.getElementById('welcome-screen'),
            game: document.getElementById('game-screen'),
            results: document.getElementById('results-screen')
        };
        const elements = {
            score: document.getElementById('score-display'),
            qCounter: document.getElementById('question-counter'),
            instruction: document.getElementById('instruction-text'),
            target: document.getElementById('target-display'),
            options: document.getElementById('options-container'),
            feedback: document.getElementById('feedback-msg'),
            finalScore: document.getElementById('final-score'),
            perfectBadge: document.getElementById('perfect-badge'),
            characterIcon: document.getElementById('character-icon')
        };

        // Characters to make it fun
        const characters = ['🤖', '👾', '👽', '🚀', '⭐', '🦖', '🐶'];

        // --- STREAMING_CHUNK:Question Generation Logic ---
        // Types of questions:
        // 1: Show Digit -> Find Word
        // 2: Show Word -> Find Digit
        // 3: Show Digit -> Find Expanded
        // 4: Show Expanded -> Find Digit
        function generateQuestion() {
            // Pick a random number between 1 and 79
            const num = Math.floor(Math.random() * 79) + 1;
            const qType = Math.floor(Math.random() * 4) + 1;
            
            let targetContent, correctOption;
            let formatAnswer; // Function to format distractor answers

            if (qType === 1) {
                elements.instruction.textContent = "Which word matches this number?";
                targetContent = num.toString();
                correctOption = numberToWords(num);
                formatAnswer = (n) => numberToWords(n);
            } else if (qType === 2) {
                elements.instruction.textContent = "Which number matches this word?";
                targetContent = numberToWords(num);
                correctOption = num.toString();
                formatAnswer = (n) => n.toString();
            } else if (qType === 3) {
                elements.instruction.textContent = "What is the expanded form?";
                targetContent = num.toString();
                correctOption = getExpandedForm(num);
                formatAnswer = (n) => getExpandedForm(n);
            } else {
                elements.instruction.textContent = "Which number is this?";
                targetContent = getExpandedForm(num);
                correctOption = num.toString();
                formatAnswer = (n) => n.toString();
            }

            elements.target.textContent = targetContent;
            currentCorrectAnswer = correctOption;

            // Generate Distractors (Wrong Answers)
            let options = [correctOption];
            while (options.length < 3) {
                // Generate a clever distractor
                let wrongNum;
                let distractorType = Math.random();
                
                if (distractorType < 0.33 && num > 10 && num % 10 !== 0) {
                    // Reverse digits (e.g., 45 -> 54)
                    let tensDigit = Math.floor(num / 10);
                    let onesDigit = num % 10;
                    wrongNum = (onesDigit * 10) + tensDigit;
                    if(wrongNum > 79) wrongNum = Math.floor(Math.random() * 79) + 1; // Keep under 79
                } else if (distractorType < 0.66) {
                    // Off by ten (e.g., 45 -> 35 or 55)
                    wrongNum = num + (Math.random() > 0.5 ? 10 : -10);
                    if (wrongNum < 1 || wrongNum > 79) wrongNum = Math.floor(Math.random() * 79) + 1;
                } else {
                    // Completely random
                    wrongNum = Math.floor(Math.random() * 79) + 1;
                }

                let wrongFormatted = formatAnswer(wrongNum);
                
                // Ensure no duplicates
                if (!options.includes(wrongFormatted)) {
                    options.push(wrongFormatted);
                }
            }

            // Shuffle options
            options.sort(() => Math.random() - 0.5);
            return options;
        }

        // --- STREAMING_CHUNK:Game Control and UI Updates ---
        function loadNextQuestion() {
            isProcessing = false;
            elements.qCounter.textContent = currentQuestion;
            elements.feedback.style.opacity = '0';
            elements.options.innerHTML = '';
            
            // Change character randomly
            elements.characterIcon.textContent = characters[Math.floor(Math.random() * characters.length)];

            const options = generateQuestion();

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                // Base button styles for Grade 1: Huge, chunky, colorful
                btn.className = 'game-btn bg-white text-brand-dark border-4 border-brand-blue rounded-3xl py-6 px-4 text-3xl md:text-4xl font-bold shadow-bubbly hover:bg-blue-50 break-words';
                
                btn.onclick = () => handleAnswer(opt, btn);
                elements.options.appendChild(btn);
            });
        }

        function handleAnswer(selected, btnElement) {
            if (isProcessing) return;
            isProcessing = true;

            const allBtns = elements.options.querySelectorAll('button');
            allBtns.forEach(b => {
                b.disabled = true;
                b.classList.remove('active:translate-y-[6px]', 'shadow-bubbly');
            });

            elements.feedback.style.opacity = '1';

            if (selected === currentCorrectAnswer) {
                // Correct
                score++;
                elements.score.textContent = score;
                
                btnElement.classList.replace('bg-white', 'bg-brand-green');
                btnElement.classList.replace('text-brand-dark', 'text-white');
                btnElement.classList.replace('border-brand-blue', 'border-brand-green');
                
                elements.feedback.textContent = "Super Correct! 🎉";
                elements.feedback.className = 'h-16 mt-6 flex items-center justify-center text-3xl font-black rounded-2xl transition-all opacity-100 bg-brand-green text-white pop-in';
                
                triggerConfetti(50);
            } else {
                // Incorrect
                btnElement.classList.replace('bg-white', 'bg-brand-red');
                btnElement.classList.replace('text-brand-dark', 'text-white');
                btnElement.classList.replace('border-brand-blue', 'border-brand-red');
                btnElement.classList.add('shake');
                
                // Highlight correct
                allBtns.forEach(b => {
                    if(b.textContent === currentCorrectAnswer) {
                        b.classList.replace('bg-white', 'bg-brand-green');
                        b.classList.replace('text-brand-dark', 'text-white');
                        b.classList.replace('border-brand-blue', 'border-brand-green');
                    }
                });

                elements.feedback.textContent = "Good try! Look at the green box.";
                elements.feedback.className = 'h-16 mt-6 flex items-center justify-center text-2xl font-bold rounded-2xl transition-all opacity-100 bg-brand-red/10 text-brand-red pop-in';
            }

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion <= totalQuestions) {
                    loadNextQuestion();
                } else {
                    endGame();
                }
            }, 2500); // Wait 2.5s before next question so they can read the right answer
        }

        function startGame() {
            screens.welcome.classList.add('hidden');
            screens.game.classList.remove('hidden');
            screens.game.classList.add('pop-in');
            score = 0;
            currentQuestion = 1;
            elements.score.textContent = score;
            loadNextQuestion();
        }

        function resetGame() {
            screens.results.classList.add('hidden');
            screens.welcome.classList.remove('hidden');
            screens.welcome.classList.add('pop-in');
            elements.perfectBadge.classList.add('hidden');
        }

        function endGame() {
            screens.game.classList.add('hidden');
            screens.results.classList.remove('hidden');
            screens.results.classList.add('pop-in');
            
            elements.finalScore.textContent = score;
            
            if (score === totalQuestions) {
                elements.perfectBadge.classList.remove('hidden');
                triggerMassiveConfetti();
            } else if (score >= 7) {
                triggerConfetti(100);
            }
        }

        // --- STREAMING_CHUNK:Confetti Visual Effects System ---
        const canvas = document.getElementById('confetti-layer');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        let animationId = null;

        function triggerConfetti(count = 50) {
            const colors = ['#FFD166', '#EF476F', '#06D6A0', '#4DB8FF', '#FFFFFF'];
            for(let i=0; i<count; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    r: Math.random() * 8 + 4,
                    dx: Math.random() * 30 - 15,
                    dy: Math.random() * -20 - 10,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10,
                    tiltAngle: 0,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05
                });
            }
            if(!animationId) animateConfetti();
        }

        function triggerMassiveConfetti() {
            triggerConfetti(150);
            setTimeout(() => triggerConfetti(100), 400);
            setTimeout(() => triggerConfetti(150), 800);
        }

        function animateConfetti() {
            animationId = requestAnimationFrame(animateConfetti);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for(let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.dy += 0.5; // gravity
                p.x += p.dx;
                p.y += p.dy;

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                ctx.stroke();

                // Remove particles that fall off screen
                if (p.y > canvas.height) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            if(particles.length === 0) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }
    </script>
</body>
</html>
