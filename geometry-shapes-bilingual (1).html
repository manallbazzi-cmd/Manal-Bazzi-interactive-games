<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry & Shapes / عالم الأشكال الهندسية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Fredoka+One&display=swap');

:root {
  --blue:#3a86ff; --purple:#8b5cf6; --pink:#f472b6;
  --yellow:#fbbf24; --green:#10b981; --orange:#f97316;
  --red:#ef4444; --teal:#06b6d4; --dark:#1e1b4b;
  --shadow:0 8px 32px rgba(58,134,255,0.15);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Tajawal',sans-serif;
  background:linear-gradient(135deg,#e0f4ff 0%,#fce7f3 50%,#ede9fe 100%);
  min-height:100vh; overflow-x:hidden;
}

/* BG SHAPES */
.bg-shapes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.bg-shape{position:absolute;opacity:.07;animation:floatS 8s ease-in-out infinite;}
.bg-shape:nth-child(1){top:5%;left:5%;width:80px;height:80px;background:var(--blue);border-radius:50%;}
.bg-shape:nth-child(2){top:15%;right:8%;width:60px;height:60px;background:var(--yellow);clip-path:polygon(50% 0%,0% 100%,100% 100%);animation-delay:1s;}
.bg-shape:nth-child(3){bottom:20%;left:10%;width:70px;height:70px;background:var(--pink);animation-delay:2s;}
.bg-shape:nth-child(4){bottom:10%;right:5%;width:90px;height:90px;background:var(--purple);clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);animation-delay:3s;}
.bg-shape:nth-child(5){top:50%;left:2%;width:50px;height:50px;background:var(--green);clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%);animation-delay:1.5s;}
@keyframes floatS{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-18px) rotate(10deg);}}

/* HEADER */
header{
  position:relative;z-index:10;
  background:linear-gradient(135deg,var(--blue) 0%,var(--purple) 100%);
  padding:16px 20px; text-align:center;
  box-shadow:0 4px 20px rgba(58,134,255,.4);
}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
header h1{
  font-family:'Fredoka One','Tajawal',sans-serif;
  font-size:clamp(1.2rem,4vw,2rem);
  color:white; text-shadow:2px 3px 0 rgba(0,0,0,.2);
}
.header-sub{color:rgba(255,255,255,.85);font-size:.85rem;}
.teacher-badge{
  display:inline-block;background:rgba(255,255,255,.2);
  border:2px solid rgba(255,255,255,.4);color:white;
  padding:3px 12px;border-radius:20px;font-size:.78rem;
  margin-top:6px;
}

/* LANG TOGGLE */
.lang-btn{
  background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5);
  color:white;border-radius:12px;padding:7px 14px;
  font-family:'Tajawal',sans-serif;font-size:.85rem;font-weight:700;
  cursor:pointer;transition:all .2s;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.lang-btn:hover{background:rgba(255,255,255,.38);}

/* STUDENT SECTION */
.student-section{
  position:relative;z-index:10;background:white;
  margin:14px;border-radius:18px;padding:14px 18px;
  box-shadow:var(--shadow);display:flex;align-items:center;
  gap:10px;flex-wrap:wrap;
}
.student-section label{font-weight:800;color:var(--dark);font-size:.9rem;white-space:nowrap;}
.student-section input{
  flex:1;min-width:160px;border:2.5px solid #e0e7ff;
  border-radius:12px;padding:9px 13px;
  font-family:'Tajawal',sans-serif;font-size:.95rem;
  outline:none;transition:border-color .2s;color:var(--dark);
}
.student-section input:focus{border-color:var(--blue);}
.start-btn{
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:white;border:none;border-radius:12px;
  padding:9px 20px;font-family:'Tajawal',sans-serif;
  font-size:.95rem;font-weight:700;cursor:pointer;
  box-shadow:0 4px 12px rgba(58,134,255,.35);transition:all .2s;
}
.start-btn:hover{transform:translateY(-2px);}

/* GRADE TABS */
.grade-tabs{
  position:relative;z-index:10;display:flex;gap:10px;
  margin:0 14px 14px;overflow-x:auto;padding-bottom:4px;
}
.grade-tab{
  flex:1;min-width:90px;background:white;
  border:2.5px solid #e0e7ff;border-radius:14px;
  padding:10px 12px;text-align:center;cursor:pointer;
  transition:all .2s;font-family:'Tajawal',sans-serif;font-weight:700;
}
.grade-tab .g-num{font-size:1.4rem;display:block;}
.grade-tab .g-lbl{font-size:.72rem;color:#777;}
.grade-tab.active{border-color:transparent;color:white;transform:translateY(-2px);box-shadow:var(--shadow);}
.grade-tab[data-grade="1"].active{background:linear-gradient(135deg,#f97316,#fbbf24);}
.grade-tab[data-grade="2"].active{background:linear-gradient(135deg,#10b981,#06b6d4);}
.grade-tab[data-grade="3"].active{background:linear-gradient(135deg,#8b5cf6,#3a86ff);}

/* MAIN */
.main{position:relative;z-index:10;padding:0 14px 30px;}
.grade-content{display:none;}
.grade-content.active{display:block;}

.section-title{
  font-size:1.1rem;font-weight:900;color:var(--dark);
  margin:18px 0 10px;display:flex;align-items:center;gap:8px;
}
.games-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;
}
.game-card{
  background:white;border-radius:20px;padding:18px 12px;
  text-align:center;cursor:pointer;transition:all .2s;
  box-shadow:0 4px 16px rgba(0,0,0,.08);border:3px solid transparent;
  position:relative;overflow:hidden;
}
.game-card::before{
  content:'';position:absolute;top:0;left:0;right:0;
  height:5px;border-radius:20px 20px 0 0;
}
.game-card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.13);}
.game-card .icon{font-size:2.5rem;margin-bottom:8px;display:block;}
.game-card .gname{font-weight:800;font-size:.88rem;color:var(--dark);margin-bottom:2px;}
.game-card .gdesc{font-size:.72rem;color:#999;}
.card-orange::before{background:var(--orange);}
.card-green::before{background:var(--green);}
.card-blue::before{background:var(--blue);}
.card-purple::before{background:var(--purple);}
.card-pink::before{background:var(--pink);}
.card-teal::before{background:var(--teal);}
.card-yellow::before{background:var(--yellow);}
.card-red::before{background:var(--red);}

/* MODAL */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(30,27,75,.7);z-index:100;
  align-items:center;justify-content:center;
  padding:14px;backdrop-filter:blur(4px);
}
.modal-overlay.open{display:flex;}
.modal{
  background:white;border-radius:24px;
  width:100%;max-width:600px;max-height:90vh;
  overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);
  animation:mIn .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes mIn{from{transform:scale(.85) translateY(20px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.modal-header{
  padding:18px 22px 14px;display:flex;
  align-items:center;justify-content:space-between;
  border-bottom:2px solid #f0f4ff;
}
.modal-title{font-size:1.2rem;font-weight:900;color:var(--dark);}
.modal-close{
  background:#f0f4ff;border:none;border-radius:10px;
  width:34px;height:34px;font-size:1.1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.modal-close:hover{background:#fce7f3;}
.modal-body{padding:18px 22px 22px;}

/* SCORE BAR */
.score-bar{
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,#f0f4ff,#fce7f3);
  border-radius:14px;padding:9px 14px;margin-bottom:14px;
}
.score-item{text-align:center;}
.score-num{font-size:1.5rem;font-weight:900;color:var(--blue);line-height:1;}
.score-label{font-size:.68rem;color:#999;}

/* QUESTION BOX */
.question-box{
  background:linear-gradient(135deg,#f8f9ff,#f0f4ff);
  border-radius:18px;padding:16px;margin-bottom:16px;text-align:center;
}
.question-text{
  font-size:clamp(.95rem,3vw,1.2rem);font-weight:800;
  color:var(--dark);line-height:1.5;margin-bottom:8px;
}
.shape-display{
  display:flex;justify-content:center;align-items:center;
  min-height:110px;margin:10px 0;
}
.shape-display svg{max-width:130px;max-height:130px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.12));}

/* OPTIONS */
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.option-btn{
  background:white;border:3px solid #e0e7ff;border-radius:14px;
  padding:11px 8px;font-family:'Tajawal',sans-serif;
  font-size:.9rem;font-weight:700;cursor:pointer;
  transition:all .15s;color:var(--dark);text-align:center;
}
.option-btn:hover{border-color:var(--blue);background:#f0f4ff;transform:translateY(-2px);}
.option-btn.correct{background:#d1fae5;border-color:var(--green);color:var(--green);}
.option-btn.wrong{background:#fee2e2;border-color:var(--red);color:var(--red);}

/* PROGRESS */
.progress-wrap{background:#e0e7ff;border-radius:20px;height:7px;overflow:hidden;margin-bottom:12px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:20px;transition:width .4s;}

/* FEEDBACK */
.feedback{
  text-align:center;padding:10px;border-radius:14px;
  font-size:1rem;font-weight:800;margin-bottom:10px;display:none;
}
.feedback.show{display:block;}
.feedback.correct{background:#d1fae5;color:var(--green);}
.feedback.wrong{background:#fee2e2;color:var(--red);}

/* NEXT BTN */
.next-btn{
  width:100%;padding:13px;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:white;border:none;border-radius:14px;
  font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:800;
  cursor:pointer;transition:all .2s;
  box-shadow:0 4px 14px rgba(58,134,255,.35);display:none;
}
.next-btn.show{display:block;}
.next-btn:hover{transform:translateY(-2px);}

/* RESULTS */
.results-screen{text-align:center;padding:20px 0;display:none;}
.results-screen.show{display:block;}
.results-emoji{font-size:3.8rem;margin-bottom:8px;}
.results-score{font-size:2.4rem;font-weight:900;color:var(--blue);margin:6px 0;}
.results-stars{font-size:1.9rem;margin-bottom:12px;}
.results-msg{font-size:1rem;font-weight:700;color:#555;margin-bottom:18px;}
.restart-btn{
  background:linear-gradient(135deg,var(--orange),var(--yellow));
  color:white;border:none;border-radius:14px;
  padding:11px 28px;font-family:'Tajawal',sans-serif;
  font-size:.95rem;font-weight:800;cursor:pointer;
  box-shadow:0 4px 14px rgba(249,115,22,.35);transition:all .2s;
}
.restart-btn:hover{transform:translateY(-2px);}

/* CONNECT */
.connect-grid{display:flex;justify-content:space-between;align-items:stretch;gap:8px;margin:10px 0;position:relative;}
.connect-col{display:flex;flex-direction:column;gap:10px;width:44%;}
.connect-item{
  background:white;border:3px solid #e0e7ff;border-radius:12px;
  padding:9px 6px;text-align:center;cursor:pointer;
  transition:all .15s;font-weight:700;font-size:.82rem;color:var(--dark);
}
.connect-item:hover{border-color:var(--blue);background:#f0f4ff;}
.connect-item.selected{border-color:var(--yellow);background:#fef9c3;}
.connect-item.matched{border-color:var(--green);background:#d1fae5;}
.connect-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}

/* DRAG/DROP */
.drag-container{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:10px 0;}
.draggable-shape{
  width:65px;height:65px;display:flex;align-items:center;justify-content:center;
  background:white;border-radius:14px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);cursor:grab;
  transition:all .15s;border:2px solid #e0e7ff;user-select:none;
}
.draggable-shape:active{cursor:grabbing;transform:scale(1.1);}
.draggable-shape svg{width:40px;height:40px;}
.drop-zones{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0;}
.drop-zone{
  min-width:95px;min-height:75px;border:3px dashed #c7d2fe;
  border-radius:14px;padding:7px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;
  transition:all .15s;background:#f8f9ff;
}
.drop-zone.drag-over{border-color:var(--blue);background:#e0f4ff;}
.drop-zone.correct-zone{border-color:var(--green);background:#d1fae5;}
.drop-zone.wrong-zone{border-color:var(--red);background:#fee2e2;}
.zone-label{font-size:.76rem;font-weight:700;color:#555;text-align:center;}

/* CANVAS / BUILDER */
.shape-canvas-wrap{text-align:center;margin:10px 0;}
#shapeCanvas{
  border:3px solid #e0e7ff;border-radius:18px;
  background:#f8f9ff;cursor:crosshair;touch-action:none;max-width:100%;
}
.tool-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:8px 0;}
.tool-btn{
  padding:7px 12px;border-radius:10px;border:2px solid #e0e7ff;
  background:white;font-family:'Tajawal',sans-serif;font-size:.82rem;
  font-weight:700;cursor:pointer;transition:all .15s;color:var(--dark);
}
.tool-btn.active,.tool-btn:hover{border-color:var(--blue);background:#e0f4ff;}
.color-swatch{
  width:28px;height:28px;border-radius:8px;
  border:3px solid transparent;cursor:pointer;transition:all .15s;
}
.color-swatch.selected{border-color:var(--dark);transform:scale(1.2);}

/* LESSONS GRID */
.lessons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:4px;}
.lesson-card{
  background:linear-gradient(135deg,#fff 60%,#f0f4ff);
  border-radius:18px;padding:16px 12px;text-align:center;
  cursor:pointer;transition:all .2s;
  box-shadow:0 4px 16px rgba(0,0,0,.07);
  border:3px solid #e0e7ff;position:relative;overflow:hidden;
}
.lesson-card::after{
  content:'📖';position:absolute;top:6px;right:8px;
  font-size:.8rem;opacity:.5;
}
[dir="ltr"] .lesson-card::after{right:auto;left:8px;}
.lesson-card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(58,134,255,.18);border-color:var(--blue);}
.lesson-card .l-icon{font-size:2.4rem;display:block;margin-bottom:8px;}
.lesson-card .l-name{font-weight:800;font-size:.88rem;color:var(--dark);margin-bottom:3px;}
.lesson-card .l-desc{font-size:.72rem;color:#888;}
.lesson-card .l-badge{
  display:inline-block;background:linear-gradient(135deg,var(--blue),var(--purple));
  color:white;border-radius:8px;padding:2px 8px;
  font-size:.65rem;font-weight:700;margin-top:6px;
}

/* LESSON MODAL CONTENT */
.lesson-slides{position:relative;overflow:hidden;}
.lesson-slide{display:none;animation:slideIn .35s ease;}
.lesson-slide.active{display:block;}
@keyframes slideIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}
[dir="rtl"] @keyframes slideIn{from{opacity:0;transform:translateX(-30px);}to{opacity:1;transform:translateX(0);}}

.slide-visual{
  background:linear-gradient(135deg,#f0f4ff,#fce7f3);
  border-radius:20px;padding:20px 16px;
  text-align:center;margin-bottom:14px;min-height:160px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
}
.slide-visual svg{max-width:150px;max-height:150px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.12));}
.slide-anim{animation:popIn .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}

.slide-title{font-size:1.15rem;font-weight:900;color:var(--dark);margin-bottom:6px;}
.slide-body{font-size:.92rem;color:#444;line-height:1.7;margin-bottom:12px;}
.slide-body strong{color:var(--blue);}
.slide-body .highlight{
  display:inline-block;background:linear-gradient(135deg,var(--yellow),#fde68a);
  color:#92400e;border-radius:8px;padding:2px 10px;font-weight:800;
}
.slide-fact{
  background:linear-gradient(135deg,#ede9fe,#ddd6fe);
  border-radius:14px;padding:10px 14px;
  font-size:.85rem;color:var(--purple);font-weight:700;
  border-right:4px solid var(--purple);margin-bottom:12px;
}
[dir="ltr"] .slide-fact{border-right:none;border-left:4px solid var(--purple);}

.slide-example-grid{
  display:flex;flex-wrap:wrap;gap:10px;
  justify-content:center;margin:10px 0;
}
.slide-example{
  background:white;border-radius:14px;padding:10px;
  text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08);
  border:2px solid #e0e7ff;min-width:80px;
}
.slide-example svg{width:54px;height:54px;}
.slide-example .ex-name{font-size:.78rem;font-weight:800;color:var(--dark);margin-top:5px;}
.slide-example .ex-sub{font-size:.68rem;color:#888;}

.slide-formula{
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:white;border-radius:16px;padding:14px 18px;
  text-align:center;font-size:1.1rem;font-weight:900;
  margin:10px 0;box-shadow:0 4px 14px rgba(58,134,255,.3);
  letter-spacing:.5px;
}
.slide-formula small{display:block;font-size:.75rem;font-weight:400;opacity:.85;margin-top:4px;}

.slide-steps{list-style:none;margin:8px 0;}
.slide-steps li{
  display:flex;gap:10px;align-items:flex-start;
  padding:9px 12px;border-radius:12px;margin-bottom:8px;
  background:#f8f9ff;border:2px solid #e0e7ff;
  font-size:.88rem;color:var(--dark);font-weight:600;
  animation:fadeSlide .4s ease both;
}
.slide-steps li:nth-child(1){animation-delay:.1s;}
.slide-steps li:nth-child(2){animation-delay:.2s;}
.slide-steps li:nth-child(3){animation-delay:.3s;}
.slide-steps li:nth-child(4){animation-delay:.4s;}
@keyframes fadeSlide{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:translateX(0);}}
[dir="ltr"] @keyframes fadeSlide{from{opacity:0;transform:translateX(-14px);}to{opacity:1;transform:translateX(0);}}
.step-num{
  min-width:26px;height:26px;background:linear-gradient(135deg,var(--blue),var(--purple));
  color:white;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:900;flex-shrink:0;
}

/* LESSON NAV */
.lesson-nav{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:14px;gap:10px;
}
.lesson-nav-btn{
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:white;border:none;border-radius:12px;
  padding:10px 20px;font-family:'Tajawal',sans-serif;
  font-size:.92rem;font-weight:800;cursor:pointer;
  transition:all .2s;box-shadow:0 3px 12px rgba(58,134,255,.3);
  display:flex;align-items:center;gap:6px;
}
.lesson-nav-btn:hover{transform:translateY(-2px);}
.lesson-nav-btn:disabled{background:#ccc;box-shadow:none;cursor:default;transform:none;}
.lesson-dots{display:flex;gap:6px;align-items:center;}
.lesson-dot{
  width:8px;height:8px;border-radius:50%;
  background:#e0e7ff;transition:all .2s;cursor:pointer;
}
.lesson-dot.active{background:var(--blue);transform:scale(1.3);}
.lesson-progress-label{font-size:.78rem;color:#888;font-weight:600;}

/* LESSON COMPLETE */
.lesson-complete{
  text-align:center;padding:20px 0;
}
.lesson-complete .lc-emoji{font-size:3.5rem;margin-bottom:8px;}
.lesson-complete .lc-title{font-size:1.3rem;font-weight:900;color:var(--dark);margin-bottom:8px;}
.lesson-complete .lc-msg{font-size:.92rem;color:#555;margin-bottom:18px;line-height:1.6;}
.lesson-complete .lc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.lc-btn-play{
  background:linear-gradient(135deg,var(--orange),var(--yellow));
  color:white;border:none;border-radius:12px;padding:11px 22px;
  font-family:'Tajawal',sans-serif;font-size:.92rem;font-weight:800;
  cursor:pointer;box-shadow:0 3px 12px rgba(249,115,22,.3);transition:all .2s;
}
.lc-btn-play:hover{transform:translateY(-2px);}
.lc-btn-again{
  background:white;color:var(--blue);border:2.5px solid var(--blue);
  border-radius:12px;padding:11px 22px;
  font-family:'Tajawal',sans-serif;font-size:.92rem;font-weight:800;
  cursor:pointer;transition:all .2s;
}
.lc-btn-again:hover{background:#f0f4ff;}

@media(max-width:480px){.lessons-grid{grid-template-columns:repeat(2,1fr);}}
.confetti-piece{
  position:fixed;width:9px;height:9px;pointer-events:none;
  z-index:9999;animation:cFall 1.5s linear forwards;border-radius:2px;
}

function shuffle(a) { return [...a].sort(()=>Math.random()-.5); }
function rnd(a) { return a[Math.floor(Math.random()*a.length)]; }

function setStudent() {
  const n = document.getElementById('studentName').value.trim();
  if (n) { studentName=n; showToast(t('hi')+n+' 🎉'); }
}

function showToast(msg) {
  const d=document.createElement('div');
  d.textContent=msg;
  Object.assign(d.style,{
    position:'fixed',bottom:'28px',left:'50%',transform:'translateX(-50%)',
    background:'#1e1b4b',color:'white',padding:'11px 22px',
    borderRadius:'14px',fontFamily:"'Tajawal',sans-serif",fontWeight:'700',
    fontSize:'1rem',zIndex:'9999',boxShadow:'0 4px 20px rgba(0,0,0,.3)'
  });
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),2400);
}

function switchGrade(g) {
  document.querySelectorAll('.grade-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.grade-content').forEach(c=>c.classList.remove('active'));
  document.querySelector(`.grade-tab[data-grade="${g}"]`).classList.add('active');
  document.getElementById('grade'+g).classList.add('active');
}

function openGame(id) {
  currentGame=id; score=0; total=0; qIndex=0;
  document.getElementById('modalOverlay').classList.add('open');
  renderGame();
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

    </div>

      <div class="connect-col" id="leftCol">
        ${left.map((s,i)=>`<div class="connect-item" data-key="${s.key}" data-side="left" id="L${i}" onclick="selectConn(this)">${s.svg.replace('viewBox','style="width:46px;height:46px" viewBox')}</div>`).join('')}
      </div>
      <svg class="connect-svg" id="cSVG"></svg>
      <div class="connect-col" id="rightCol">
        ${right.map((s,i)=>`<div class="connect-item" data-key="${s.key}" data-side="right" id="R${i}" onclick="selectConn(this)">${sName(s.key)}</div>`).join('')}
      </div>
    </div>
    <div class="feedback" id="fb"></div>
    <button class="next-btn show" onclick="checkAllMatch()">${t('check_match')}</button>`;
  window._matchSel=null; window._matchPairs={};
}

function selectConn(el) {
  if(el.classList.contains('matched')) return;
  const side=el.dataset.side;
  if(!window._matchSel) {
    document.querySelectorAll('.connect-item.selected').forEach(e=>e.classList.remove('selected'));
    el.classList.add('selected'); window._matchSel=el;
  } else {
    const prev=window._matchSel;
    if(prev.dataset.side===side){ prev.classList.remove('selected'); el.classList.add('selected'); window._matchSel=el; return; }
    const lEl=side==='right'?prev:el, rEl=side==='right'?el:prev;
    window._matchPairs[lEl.id]=rEl.id;
    drawConnLine(lEl,rEl);
    prev.classList.remove('selected'); window._matchSel=null;
  }
}
function drawConnLine(l,r) {
  const svg=document.getElementById('cSVG');
  const gr=document.getElementById('cGrid').getBoundingClientRect();
  const lr=l.getBoundingClientRect(), rr=r.getBoundingClientRect();
  const x1=lr.right-gr.left, y1=lr.top+lr.height/2-gr.top;
  const x2=rr.left-gr.left, y2=rr.top+rr.height/2-gr.top;
  const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
  ln.setAttribute('x1',x1);ln.setAttribute('y1',y1);ln.setAttribute('x2',x2);ln.setAttribute('y2',y2);
  ln.setAttribute('stroke','#3a86ff');ln.setAttribute('stroke-width','3');ln.setAttribute('stroke-linecap','round');
  ln.id='line_'+l.id; svg.appendChild(ln);
}
function checkAllMatch() {
  let ok=0,tot=0;
  for(const [lid,rid] of Object.entries(window._matchPairs)) {
    tot++;
    const lEl=document.getElementById(lid), rEl=document.getElementById(rid);
    const correct=lEl.dataset.key===rEl.dataset.key;
    if(correct){ok++;lEl.classList.add('matched');rEl.classList.add('matched');const ln=document.getElementById('line_'+lid);if(ln)ln.setAttribute('stroke','#10b981');}
    else{const ln=document.getElementById('line_'+lid);if(ln)ln.setAttribute('stroke','#ef4444');}
  }
  const fb=document.getElementById('fb');
  fb.textContent=`${t('match_result')} ${ok} ${t('of')} ${tot}!`;
  fb.className='feedback show '+(ok===tot?'correct':'wrong');
  if(ok===tot) confetti();
}

function aD(e){e.preventDefault();}
function dStart(e,key,sides){e.dataTransfer.setData('key',key);e.dataTransfer.setData('sides',sides);}
function dDrop(e,cat){
  e.preventDefault();
  const key=e.dataTransfer.getData('key'), sides=parseInt(e.dataTransfer.getData('sides'));
  const zone=e.currentTarget;
  const ok=(cat==='round'&&sides===0)||(cat==='3'&&sides===3)||(cat==='4'&&sides===4)||(cat==='5+'&&sides>=5);
  zone.classList.add(ok?'correct-zone':'wrong-zone');
  const fb=document.getElementById('fb');
  fb.textContent=ok?`✅ ${sName(key)} ${t('correct_sort')}`:`❌ ${sName(key)} ${t('wrong_sort')}`;
  fb.className='feedback show '+(ok?'correct':'wrong');
  if(ok){score++;confetti();}
  document.querySelectorAll('.draggable-shape').forEach(d=>{if(d.dataset.key===key)d.remove();});
  zone.innerHTML+=`<span style="font-size:.72rem;font-weight:700;color:#333;margin-top:2px">${sName(key)}</span>`;
}
let _tEl=null;
function tStart(e,el){_tEl=el;el.style.opacity='.6';document.addEventListener('touchend',tEnd,{once:true});}
function tEnd(e){
  if(!_tEl)return;_tEl.style.opacity='1';
  const touch=e.changedTouches[0];
  const target=document.elementFromPoint(touch.clientX,touch.clientY);
  const zone=target?.closest('.drop-zone');
  if(zone){const fe={preventDefault:()=>{},dataTransfer:{getData:k=>k==='key'?_tEl.dataset.key:_tEl.dataset.sides},currentTarget:zone};dDrop(fe,zone.dataset.cat);}
  _tEl=null;
}

let tool='circle',clr='#3a86ff',drawing=false,sX=0,sY=0,canvHist=[];
function setTool(tk){
  tool=tk;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
  const m={circle:'tbC',rect:'tbR',triangle:'tbT',pen:'tbP',eraser:'tbE'};
  document.getElementById(m[tk])?.classList.add('active');
}
function setClr(c,el){
  clr=c;
  document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));
  el.classList.add('selected');
  if(tool==='eraser') setTool('pen');
}
function clearC(){const cv=document.getElementById('shapeCanvas');if(!cv)return;cv.getContext('2d').clearRect(0,0,cv.width,cv.height);canvHist=[];}
function initCanvas(){
  const cv=document.getElementById('shapeCanvas');if(!cv)return;
  const ctx=cv.getContext('2d');canvHist=[];
  function gp(e){const r=cv.getBoundingClientRect(),sx=cv.width/r.width,sy=cv.height/r.height;if(e.touches)return{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy};return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};}
  function dn(e){e.preventDefault();drawing=true;const p=gp(e);sX=p.x;sY=p.y;if(tool==='pen'||tool==='eraser'){canvHist.push(ctx.getImageData(0,0,cv.width,cv.height));ctx.beginPath();ctx.moveTo(sX,sY);}}
  function mv(e){if(!drawing)return;e.preventDefault();const p=gp(e);if(tool==='pen'){ctx.strokeStyle=clr;ctx.lineWidth=4;ctx.lineCap='round';ctx.lineTo(p.x,p.y);ctx.stroke();}else if(tool==='eraser'){ctx.strokeStyle='white';ctx.lineWidth=20;ctx.lineCap='round';ctx.lineTo(p.x,p.y);ctx.stroke();}else{if(canvHist.length)ctx.putImageData(canvHist[canvHist.length-1],0,0);ctx.strokeStyle=clr;ctx.fillStyle=clr+'44';ctx.lineWidth=3;const w=p.x-sX,h=p.y-sY;if(tool==='rect'){ctx.beginPath();ctx.rect(sX,sY,w,h);ctx.fill();ctx.stroke();}else if(tool==='circle'){const rx=Math.abs(w)/2,ry=Math.abs(h)/2;ctx.beginPath();ctx.ellipse(sX+w/2,sY+h/2,rx,ry,0,0,2*Math.PI);ctx.fill();ctx.stroke();}else if(tool==='triangle'){ctx.beginPath();ctx.moveTo(sX+w/2,sY);ctx.lineTo(sX+w,sY+h);ctx.lineTo(sX,sY+h);ctx.closePath();ctx.fill();ctx.stroke();}}}
  function up(e){if(!drawing)return;e.preventDefault();drawing=false;canvHist.push(ctx.getImageData(0,0,cv.width,cv.height));if(canvHist.length>20)canvHist.shift();}
  cv.addEventListener('mousedown',dn);cv.addEventListener('mousemove',mv);cv.addEventListener('mouseup',up);
  cv.addEventListener('touchstart',dn,{passive:false});cv.addEventListener('touchmove',mv,{passive:false});cv.addEventListener('touchend',up,{passive:false});
}

function confetti(){
  const cols=['#3a86ff','#f97316','#10b981','#8b5cf6','#f472b6','#fbbf24','#ef4444'];
  for(let i=0;i<16;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.left=Math.random()*100+'vw'; p.style.top='0';
    p.style.background=cols[Math.floor(Math.random()*cols.length)];
    p.style.animationDuration=(1+Math.random())+'s';
    p.style.animationDelay=Math.random()*.3+'s';
    p.style.borderRadius=Math.random()>.5?'50%':'3px';
    document.body.appendChild(p); setTimeout(()=>p.remove(),2000);
  }
}

// ========== SOUND ENGINE (Web Audio API) ==========
let _ctx = null;
function getAudioCtx() {
  if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (_ctx.state === 'suspended') _ctx.resume();
  return _ctx;
}

// Generic tone player
function playTone(freq, type, duration, vol=0.4, delay=0) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
    gain.gain.setValueAtTime(0, ctx.currentTime + delay);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + delay + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration + 0.05);
  } catch(e) {}
}

// 🎨 Draw stroke — soft pencil scratch
function soundDraw() {
  try {
    const ctx = getAudioCtx();
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.06, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * (1 - i/data.length) * 0.4;
    const src = ctx.createBufferSource();
    const gain = ctx.createGain(); gain.gain.value = 0.18;
    src.buffer = buf; src.connect(gain); gain.connect(ctx.destination);
    src.start();
  } catch(e) {}
}

      },
    ],
  }
};

// ========== LESSON RENDERING ==========
let lessonSlideIndex = 0;
let currentLessonData = null;

function buildLessonCards() {
  const grades = [1,2,3];
  const lessTitleIds = {1:'g1les_title', 2:'g2les_title', 3:'g3les_title'};
  const gridIds = {1:'g1lessons', 2:'g2lessons', 3:'g3lessons'};
  const lesTitles = {ar:{1:'دروس تعليمية — الصف الأول',2:'دروس تعليمية — الصف الثاني',3:'دروس تعليمية — الصف الثالث'},
                     en:{1:'Learning Lessons — Grade 1',2:'Learning Lessons — Grade 2',3:'Learning Lessons — Grade 3'}};

  grades.forEach(g => {
    const titleEl = document.getElementById(lessTitleIds[g]);
    if (titleEl) titleEl.textContent = lesTitles[lang][g];
    const grid = document.getElementById(gridIds[g]);
    if (!grid) return;
    const lessons = LESSONS[lang]['grade'+g] || [];
    grid.innerHTML = lessons.map(l => `
      <div class="lesson-card" onclick="openLesson('grade${g}','${l.id}')">
        <span class="l-icon">${l.icon}</span>
        <div class="l-name">${l.name}</div>
        <div class="l-desc">${l.desc}</div>
        <div class="l-badge">${l.badge}</div>
      </div>`).join('');
  });
}

function openLesson(grade, lessonId) {
  soundClick();
  const lessons = LESSONS[lang][grade] || [];
  const lesson = lessons.find(l => l.id === lessonId);
  if (!lesson) return;
  currentLessonData = lesson;
  lessonSlideIndex = 0;
  document.getElementById('modalTitle').textContent = lesson.icon + ' ' + lesson.name;
  document.getElementById('modalOverlay').classList.add('open');
  renderLessonSlide();
}

function renderLessonSlide() {
  const body = document.getElementById('modalBody');
  const lesson = currentLessonData;
  const slides = lesson.slides;
  const slide = slides[lessonSlideIndex];
  const total = slides.length;
  const isLast = lessonSlideIndex === total - 1;
  const isAr = lang === 'ar';

  const dotsHTML = slides.map((_,i) =>
    `<div class="lesson-dot ${i===lessonSlideIndex?'active':''}" onclick="goLessonSlide(${i})"></div>`
  ).join('');

  const prevLabel = isAr ? '◀ السابق' : '◀ Prev';
  const nextLabel = isAr ? 'التالي ▶' : 'Next ▶';
  const doneLabel = isAr ? '🎉 اكتمل الدرس!' : '🎉 Lesson Complete!';

  body.innerHTML = `
    <div class="progress-wrap" style="margin-bottom:16px">
      <div class="progress-fill" style="width:${Math.round(((lessonSlideIndex+1)/total)*100)}%"></div>
    </div>
    <div class="lesson-slides">
      <div class="lesson-slide active">
        <div class="slide-visual">${slide.visual}</div>
        <div class="slide-title">${slide.title}</div>
        <div class="slide-body">${slide.body}</div>
        ${slide.fact ? `<div class="slide-fact">${slide.fact}</div>` : ''}
      </div>
    </div>
    <div class="lesson-nav">
      <button class="lesson-nav-btn" onclick="prevSlide()" ${lessonSlideIndex===0?'disabled':''}>${prevLabel}</button>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div class="lesson-dots">${dotsHTML}</div>
        <span class="lesson-progress-label">${lessonSlideIndex+1} / ${total}</span>
      </div>
      <button class="lesson-nav-btn" onclick="${isLast?'showLessonComplete()':'nextSlide()'}">${isLast?doneLabel:nextLabel}</button>
    </div>`;
  soundNext();
}

function nextSlide() {
  if (!currentLessonData) return;
  if (lessonSlideIndex < currentLessonData.slides.length - 1) {
    lessonSlideIndex++;
    renderLessonSlide();
  }
}
function prevSlide() {
  if (lessonSlideIndex > 0) { lessonSlideIndex--; renderLessonSlide(); }
}
function goLessonSlide(i) { lessonSlideIndex = i; renderLessonSlide(); }

function showLessonComplete() {
  soundWin();
  confetti();
  const body = document.getElementById('modalBody');
  const lesson = currentLessonData;
  const isAr = lang === 'ar';
  body.innerHTML = `
    <div class="lesson-complete">
      <div class="lc-emoji">🏆</div>
      <div class="lc-title">${isAr?'أحسنت! أكملت الدرس!':'Great job! Lesson Complete!'}</div>
      <div class="lc-msg">
        ${isAr?`لقد تعلمت: <strong>${lesson.name}</strong><br>هل أنت مستعد للعب وتطبيق ما تعلمته؟`
               :`You learned: <strong>${lesson.name}</strong><br>Ready to play and practice what you learned?`}
      </div>
      <div class="lc-btns">
        <button class="lc-btn-again" onclick="lessonSlideIndex=0;renderLessonSlide()">${isAr?'🔄 راجع الدرس':'🔄 Review Lesson'}</button>
        <button class="lc-btn-play" onclick="closeModal();openGame('${lesson.gameLink}')">${isAr?'🎮 العب الآن!':'🎮 Play Now!'}</button>
      </div>
    </div>`;
}

// Rebuild lesson cards when language changes
const _origToggleLang = toggleLang;
toggleLang = function() {
  _origToggleLang();
  buildLessonCards();
};

// Inject sound toggle button into header
document.querySelector('header').insertAdjacentHTML('beforeend',
  `<button id="soundToggle" onclick="toggleSound()" title="Mute/Unmute sounds"
    style="position:absolute;top:14px;${lang==='ar'?'left':'right'}:14px;
    background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.45);
    color:white;border-radius:12px;padding:6px 12px;font-size:1.1rem;
    cursor:pointer;transition:all .2s;z-index:20;">🔊</button>`
);

// Hook sounds into existing functions by patching key interactions
document.addEventListener('click', function(e) {
  // Game cards
  if (e.target.closest('.game-card')) { soundClick(); return; }
  // Grade tabs
  if (e.target.closest('.grade-tab')) { soundTab(); return; }
  // Start button
  if (e.target.id === 'btnStart') { soundStart(); return; }
  // Next question buttons
  if (e.target.classList.contains('next-btn') && e.target.classList.contains('show')) { soundNext(); return; }
  // Restart
  if (e.target.classList.contains('restart-btn')) { soundStart(); return; }
  // Check match button
  if (e.target.textContent.includes('✓') || e.target.textContent.includes('Check')) { soundClick(); return; }
});

// Patch checkOpt & checkNum to play sounds
const _origCheckOpt = checkOpt;
checkOpt = function(btn, chosen, correct, type) {
  const isCorrect = chosen === correct;
  _origCheckOpt(btn, chosen, correct, type);
  if (isCorrect) soundCorrect(); else soundWrong();
};
const _origCheckNum = checkNum;
checkNum = function(btn, chosen, correct, type) {
  const isCorrect = chosen === correct;
  _origCheckNum(btn, chosen, correct, type);
  if (isCorrect) soundCorrect(); else soundWrong();
};
const _origCheckSym = checkSym;
checkSym = function(btn, chosen, correct) {
  const isCorrect = chosen === correct;
  _origCheckSym(btn, chosen, correct);
  if (isCorrect) soundCorrect(); else soundWrong();
};

// Win sound on results
const _origShowResults = showResults;
showResults = function(body) {
  _origShowResults(body);
  const pct = total ? Math.round((score/total)*100) : 0;
  if (pct >= 60) setTimeout(soundWin, 300); else soundWrong();
};

// Draw sound on canvas
document.addEventListener('mousedown', e => { if(e.target.id==='shapeCanvas') soundDraw(); });
document.addEventListener('touchstart', e => { if(e.target.id==='shapeCanvas') soundDraw(); }, {passive:true});

// Match/connect sound
const _origCheckAllMatch = checkAllMatch;
checkAllMatch = function() {
  _origCheckAllMatch();
  soundMatch();
};

// ========== PAGE INIT ==========
applyLang();
buildLessonCards();
</script>
</body>
</html>
