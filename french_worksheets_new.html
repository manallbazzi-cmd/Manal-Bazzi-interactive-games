<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Fiches de Français — Maîtresse Manal Bazzi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Tajawal:wght@700;800&display=swap');

:root {
  --bg:#fdf8ff; --card:#ffffff; --card2:#f5f0ff;
  --lavender:#7c3aed; --mint:#059669; --sky:#0284c7;
  --pink:#db2777; --gold:#d97706; --teal:#0891b2;
  --rose:#e11d48; --text:#1e1b4b; --sub:#6b7280;
  --green:#059669; --orange:#ea580c;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Nunito',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 10% 0%,rgba(192,132,252,.16) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 10%,rgba(244,114,182,.12) 0%,transparent 60%),
    radial-gradient(ellipse 70% 60% at 50% 100%,rgba(167,243,208,.15) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 80%,rgba(251,191,36,.12) 0%,transparent 60%);
}

/* ── HEADER ── */
header{
  position:relative;z-index:10;
  text-align:center;padding:36px 20px 28px;
  background:linear-gradient(135deg,#fce7f3 0%,#ede9fe 50%,#dbeafe 100%);
  border-bottom:2px solid rgba(124,58,237,.12);
}
.teacher-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(217,119,6,.12);border:1.5px solid rgba(217,119,6,.4);
  border-radius:30px;padding:6px 18px;font-size:.82rem;
  color:#92400e;margin-bottom:16px;letter-spacing:.5px;
  font-family:'Tajawal',sans-serif;
}
h1{
  font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;
  background:linear-gradient(135deg,#7c3aed,#db2777,#0284c7);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:8px;line-height:1.2;
}
.subtitle{color:var(--sub);font-size:.95rem;margin-bottom:24px;}

/* ── STUDENT INPUT ── */
.student-row{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.student-row input{
  background:#fff;border:1.5px solid #ddd6fe;
  border-radius:12px;padding:9px 16px;color:var(--text);
  font-family:'Nunito',sans-serif;font-size:.95rem;
  outline:none;transition:border-color .2s;width:220px;
  box-shadow:0 2px 8px rgba(124,58,237,.08);
}
.student-row input:focus{border-color:#7c3aed;}
.student-row input::placeholder{color:#9ca3af;}

/* ── SELECTORS ── */
.selectors{
  position:relative;z-index:10;
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:20px;padding:28px 20px;
  background:#fff;border-bottom:1px solid #ede9fe;
}
.selector-group{display:flex;flex-direction:column;gap:10px;align-items:center;}
.selector-label{font-size:.75rem;color:var(--sub);font-weight:800;text-transform:uppercase;letter-spacing:1.5px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.sel-btn{
  padding:9px 18px;border-radius:12px;border:1.5px solid #ede9fe;
  background:#fdf8ff;cursor:pointer;
  font-family:'Nunito',sans-serif;font-size:.92rem;font-weight:700;
  color:#6b7280;transition:all .22s;
}
.sel-btn:hover{border-color:#a78bfa;color:var(--text);background:#ede9fe;}
.grade-btn.active{background:#7c3aed;border-color:#7c3aed;color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.3);}
.topic-btn[data-topic="alphabet"].active{background:#059669;border-color:#059669;color:#fff;box-shadow:0 4px 14px rgba(5,150,105,.3);}
.topic-btn[data-topic="vocab"].active{background:#0284c7;border-color:#0284c7;color:#fff;box-shadow:0 4px 14px rgba(2,132,199,.3);}
.topic-btn[data-topic="genre"].active{background:#db2777;border-color:#db2777;color:#fff;box-shadow:0 4px 14px rgba(219,39,119,.3);}
.topic-btn[data-topic="verbes"].active{background:#d97706;border-color:#d97706;color:#fff;box-shadow:0 4px 14px rgba(217,119,6,.3);}
.topic-btn[data-topic="phrases"].active{background:#7c3aed;border-color:#7c3aed;color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.3);}

/* ── START ── */
.start-wrap{text-align:center;padding:24px 20px 32px;position:relative;z-index:10;background:#fdf8ff;}
.start-btn{
  background:linear-gradient(135deg,#7c3aed,#db2777);
  border:none;border-radius:16px;padding:14px 44px;
  font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:900;
  color:#fff;cursor:pointer;transition:all .22s;
  box-shadow:0 6px 24px rgba(124,58,237,.35);letter-spacing:.5px;
}
.start-btn:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(124,58,237,.45);}

/* ── WORKSHEET ── */
#worksheet-area{display:none;position:relative;z-index:10;padding:0 16px 40px;max-width:900px;margin:0 auto;}
.ws-header{
  background:linear-gradient(135deg,#ede9fe,#fce7f3);
  border:1.5px solid #ddd6fe;border-radius:20px;
  padding:20px 24px;margin-bottom:24px;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;
}
.ws-title{font-size:1.3rem;font-weight:900;color:var(--text);}
.ws-badges{display:flex;gap:8px;flex-wrap:wrap;}
.badge{padding:4px 14px;border-radius:20px;font-size:.75rem;font-weight:700;letter-spacing:.5px;}
.badge-grade{background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd;}
.badge-topic{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;}

.stats-bar{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:24px;}
.stat-card{
  background:#fff;border:1.5px solid #ede9fe;
  border-radius:14px;padding:12px 20px;text-align:center;flex:1;min-width:100px;
  box-shadow:0 2px 10px rgba(124,58,237,.07);
}
.stat-num{font-size:1.6rem;font-weight:900;color:#7c3aed;line-height:1;}
.stat-lbl{font-size:.72rem;color:var(--sub);margin-top:3px;}

.progress-wrap{background:#ede9fe;border-radius:20px;height:9px;overflow:hidden;margin-bottom:24px;}
.progress-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#db2777);border-radius:20px;transition:width .5s ease;width:0%;}

.questions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px;}
.q-card{
  background:#fff;border:1.5px solid #ede9fe;
  border-radius:18px;padding:20px 18px;
  position:relative;overflow:hidden;transition:all .22s;
  box-shadow:0 3px 14px rgba(124,58,237,.08);
}
.q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:18px 18px 0 0;background:linear-gradient(90deg,#7c3aed,#db2777);}
.q-card:hover{box-shadow:0 6px 22px rgba(124,58,237,.14);transform:translateY(-2px);}
.q-card.correct{border-color:#6ee7b7;background:#f0fdf4;}
.q-card.correct::before{background:linear-gradient(90deg,#059669,#34d399);}
.q-card.wrong{border-color:#fca5a5;background:#fff1f2;}
.q-card.wrong::before{background:linear-gradient(90deg,#e11d48,#f87171);}

.q-number{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#db2777);color:white;font-size:.78rem;font-weight:900;margin-bottom:10px;}
.q-big{font-size:2.6rem;font-weight:900;color:#7c3aed;text-align:center;margin:6px 0 10px;line-height:1;}
.q-question{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:14px;line-height:1.5;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.choice-btn{
  background:#fdf8ff;border:1.5px solid #ede9fe;
  border-radius:10px;padding:9px 10px;
  font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:700;
  color:var(--text);cursor:pointer;transition:all .18s;text-align:center;
}
.choice-btn:hover:not(:disabled){border-color:#7c3aed;background:#ede9fe;transform:translateY(-2px);}
.choice-btn.selected{border-color:#0284c7;background:#e0f2fe;color:#0c4a6e;}
.choice-btn.correct-choice{border-color:#059669;background:#d1fae5;color:#065f46;}
.choice-btn.wrong-choice{border-color:#e11d48;background:#ffe4e6;color:#9f1239;}
.q-feedback{font-size:.85rem;font-weight:800;margin-top:10px;min-height:20px;text-align:center;}
.hint-text{font-size:.72rem;color:#9ca3af;margin-top:6px;text-align:center;font-style:italic;}

.action-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:28px;}
.check-btn{background:linear-gradient(135deg,#059669,#0284c7);border:none;border-radius:14px;padding:13px 36px;font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 4px 18px rgba(5,150,105,.3);transition:all .2s;}
.check-btn:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(5,150,105,.4);}
.reset-btn{background:#fdf8ff;border:1.5px solid #ede9fe;border-radius:14px;padding:13px 28px;font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:700;color:var(--sub);cursor:pointer;transition:all .2s;}
.reset-btn:hover{border-color:#e11d48;color:#e11d48;}
.new-btn{background:linear-gradient(135deg,#7c3aed,#db2777);border:none;border-radius:14px;padding:13px 28px;font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:900;color:white;cursor:pointer;box-shadow:0 4px 18px rgba(124,58,237,.3);transition:all .2s;}
.new-btn:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(124,58,237,.4);}

.result-panel{
  display:none;
  background:linear-gradient(135deg,#ede9fe,#fce7f3);
  border:2px solid #ddd6fe;border-radius:22px;
  padding:30px;text-align:center;margin-bottom:28px;
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
.result-emoji{font-size:3.5rem;display:block;margin-bottom:8px;}
.result-score{font-size:2.8rem;font-weight:900;background:linear-gradient(135deg,#7c3aed,#db2777);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:4px 0;}
.result-stars{font-size:1.8rem;margin-bottom:8px;letter-spacing:4px;}
.result-msg{font-size:1rem;color:#4b5563;font-weight:700;}
.result-name{font-size:1.1rem;color:#92400e;font-weight:900;margin-top:6px;}

.float-star{position:fixed;pointer-events:none;z-index:9999;font-size:1.5rem;animation:starFloat 1.2s ease-out forwards;}
@keyframes starFloat{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-90px) scale(1.5);opacity:0;}}
.confetti-p{position:fixed;width:9px;height:9px;pointer-events:none;z-index:9999;border-radius:2px;animation:cFall 1.5s linear forwards;}
@keyframes cFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}

.sound-btn{
  position:absolute;top:14px;right:14px;
  background:rgba(124,58,237,.1);border:1.5px solid #ddd6fe;
  color:#7c3aed;border-radius:12px;padding:7px 12px;
  font-size:1.1rem;cursor:pointer;transition:all .2s;z-index:20;
}
.sound-btn:hover{background:rgba(124,58,237,.18);}

@media(max-width:480px){
  .questions-grid{grid-template-columns:1fr;}
  .choices{grid-template-columns:1fr 1fr;}
}
</style>
<script src="stars-system.js"></script>
</head>
<body class="notranslate" translate="no">

<header>
  <button class="sound-btn" id="soundBtn" onclick="toggleSound()" title="Muet/Son">🔊</button>
  <div class="teacher-badge">👩‍🏫 Maîtresse Manal Bazzi &nbsp;|&nbsp; 🌟 Fiches interactives</div>
  <h1>🇫🇷 Français</h1>
  <p class="subtitle">Choisissez la classe et le thème, puis commencez !</p>
  <div class="student-row">
    <span style="color:var(--sub);font-weight:700;font-size:.9rem">👤 Ton prénom :</span>
    <input type="text" id="studentName" placeholder="Écris ton prénom..." />
  </div>
</header>

<div class="selectors">
  <div class="selector-group">
    <span class="selector-label">📚 Classe</span>
    <div class="btn-row">
      <button class="sel-btn grade-btn active" data-grade="1">CE1</button>
      <button class="sel-btn grade-btn" data-grade="2">CE2</button>
      <button class="sel-btn grade-btn" data-grade="3">CM1</button>
    </div>
  </div>
  <div class="selector-group">
    <span class="selector-label">📝 Thème</span>
    <div class="btn-row">
      <button class="sel-btn topic-btn active" data-topic="alphabet">🔤 Alphabet</button>
      <button class="sel-btn topic-btn" data-topic="vocab">📖 Vocabulaire</button>
      <button class="sel-btn topic-btn" data-topic="genre">⚖️ Genre</button>
      <button class="sel-btn topic-btn" data-topic="verbes">✏️ Verbes</button>
      <button class="sel-btn topic-btn" data-topic="phrases">💬 Phrases</button>
    </div>
  </div>
</div>

<div class="start-wrap">
  <button class="start-btn" onclick="startWorksheet()">🚀 Commencer la fiche</button>
</div>

<div id="worksheet-area">
  <div class="ws-header">
    <div>
      <div class="ws-title" id="ws-title">Fiche Alphabet</div>
      <div style="color:var(--sub);font-size:.8rem;margin-top:4px" id="ws-student-label"></div>
    </div>
    <div class="ws-badges">
      <span class="badge badge-grade" id="ws-grade-badge">CE1</span>
      <span class="badge badge-topic" id="ws-topic-badge">🔤 Alphabet</span>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-num" id="score-val">0</div>
      <div class="stat-lbl">✅ Correct</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="answered-count">0</div>
      <div class="stat-lbl">✏️ Répondu</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="score-total">10</div>
      <div class="stat-lbl">📝 Total</div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <div class="result-panel" id="result-panel">
    <span class="result-emoji" id="result-emoji">🏆</span>
    <div class="result-score" id="result-score">10 / 10</div>
    <div class="result-stars" id="result-stars">⭐⭐⭐</div>
    <div class="result-msg" id="result-msg">Excellent !</div>
    <div class="result-name" id="result-name"></div>
  </div>

  <div class="questions-grid" id="questions-grid"></div>

  <div class="action-row">
    <button class="check-btn" onclick="checkAll()">🔍 Vérifier les réponses</button>
    <button class="new-btn" onclick="startWorksheet()">🔄 Nouvelles questions</button>
    <button class="reset-btn" onclick="resetAll()">↺ Recommencer</button>
  </div>
</div>

<script>
// ═══ SOUND ═══
let soundOn=true,_actx=null;
function getACtx(){if(!_actx)_actx=new(window.AudioContext||window.webkitAudioContext)();if(_actx.state==='suspended')_actx.resume();return _actx;}
function tone(freq,type,dur,vol=.35,delay=0){
  try{const c=getACtx(),o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.type=type;
  o.frequency.setValueAtTime(freq,c.currentTime+delay);
  g.gain.setValueAtTime(0,c.currentTime+delay);
  g.gain.linearRampToValueAtTime(vol,c.currentTime+delay+.01);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+dur);
  o.start(c.currentTime+delay);o.stop(c.currentTime+delay+dur+.05);}catch(e){}
}
function sndCorrect(){if(!soundOn)return;[523,659,784,1047].forEach((f,i)=>tone(f,'sine',.18,.32,i*.09));}
function sndWrong(){if(!soundOn)return;tone(220,'sawtooth',.12,.28);tone(180,'sawtooth',.18,.22,.1);}
function sndStart(){if(!soundOn)return;[440,660,880].forEach((f,i)=>tone(f,'sine',.1,.28,i*.07));}
function sndWin(){if(!soundOn)return;[[523,0],[659,.1],[784,.2],[1047,.35],[784,.55],[1047,.7],[1319,.85]].forEach(([f,d])=>tone(f,'sine',.22,.35,d));[1319,1568,2093].forEach((f,i)=>tone(f,'triangle',.15,.18,.95+i*.1));}
function sndClick(){if(!soundOn)return;tone(700,'sine',.07,.14);}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn)sndClick();}

// ═══ DATA ═══
const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const alphaNames={A:'A comme Avion',B:'B comme Ballon',C:'C comme Chat',D:'D comme Drapeau',E:'E comme Étoile',F:'F comme Fleur',G:'G comme Girafe',H:'H comme Hibou',I:'I comme Île',J:'J comme Jus',K:'K comme Koala',L:'L comme Lapin',M:'M comme Maison',N:'N comme Nuage',O:'O comme Orange',P:'P comme Pomme',Q:'Q comme Quille',R:'R comme Rose',S:'S comme Soleil',T:'T comme Train',U:'U comme Ours',V:'V comme Violon',W:'W comme Wagon',X:'X comme Xylophone',Y:'Y comme Yoyo',Z:'Z comme Zèbre'};

const vocabCouleurs=[
  {fr:'rouge',ar:'أحمر',emoji:'🔴'},{fr:'bleu',ar:'أزرق',emoji:'🔵'},
  {fr:'vert',ar:'أخضر',emoji:'🟢'},{fr:'jaune',ar:'أصفر',emoji:'🟡'},
  {fr:'orange',ar:'برتقالي',emoji:'🟠'},{fr:'violet',ar:'بنفسجي',emoji:'🟣'},
  {fr:'blanc',ar:'أبيض',emoji:'⬜'},{fr:'noir',ar:'أسود',emoji:'⬛'},
  {fr:'rose',ar:'وردي',emoji:'🌸'},{fr:'marron',ar:'بني',emoji:'🟤'},
];
const vocabAnimaux=[
  {fr:'le chat',img:'🐱'},{fr:'le chien',img:'🐶'},{fr:'le lapin',img:'🐰'},
  {fr:"l'oiseau",img:'🐦'},{fr:'le poisson',img:'🐟'},{fr:'le lion',img:'🦁'},
  {fr:"l'éléphant",img:'🐘'},{fr:'le serpent',img:'🐍'},{fr:'le cheval',img:'🐴'},
  {fr:'la vache',img:'🐮'},{fr:'le mouton',img:'🐑'},{fr:'le cochon',img:'🐷'},
];
const vocabChiffres=[
  {n:1,fr:'un'},{n:2,fr:'deux'},{n:3,fr:'trois'},{n:4,fr:'quatre'},{n:5,fr:'cinq'},
  {n:6,fr:'six'},{n:7,fr:'sept'},{n:8,fr:'huit'},{n:9,fr:'neuf'},{n:10,fr:'dix'},
  {n:11,fr:'onze'},{n:12,fr:'douze'},{n:13,fr:'treize'},{n:14,fr:'quatorze'},{n:15,fr:'quinze'},
  {n:20,fr:'vingt'},{n:30,fr:'trente'},{n:40,fr:'quarante'},{n:50,fr:'cinquante'},{n:100,fr:'cent'},
];
const vocabFamille=[
  {fr:'la mère',emoji:'👩'},{fr:'le père',emoji:'👨'},{fr:'la sœur',emoji:'👧'},
  {fr:'le frère',emoji:'👦'},{fr:'la grand-mère',emoji:'👵'},{fr:'le grand-père',emoji:'👴'},
  {fr:"l'oncle",emoji:'🧔'},{fr:'la tante',emoji:'👩‍🦱'},
];
const genrePairs=[
  {m:'un chat',f:'une chatte'},{m:'un chien',f:'une chienne'},{m:'un lion',f:'une lionne'},
  {m:'un directeur',f:'une directrice'},{m:'un acteur',f:'une actrice'},
  {m:'un boulanger',f:'une boulangère'},{m:'un écolier',f:'une écolière'},
  {m:'un ami',f:'une amie'},{m:'un prince',f:'une princesse'},
  {m:'un roi',f:'une reine'},{m:'un coq',f:'une poule'},
];
const verbesEtre=[{p:'je',f:'suis'},{p:'tu',f:'es'},{p:'il/elle',f:'est'},{p:'nous',f:'sommes'},{p:'vous',f:'êtes'},{p:"ils/elles",f:'sont'}];
const verbesAvoir=[{p:'je',f:'ai'},{p:'tu',f:'as'},{p:'il/elle',f:'a'},{p:'nous',f:'avons'},{p:'vous',f:'avez'},{p:"ils/elles",f:'ont'}];
const verbesAller=[{p:'je',f:'vais'},{p:'tu',f:'vas'},{p:'il/elle',f:'va'},{p:'nous',f:'allons'},{p:'vous',f:'allez'},{p:"ils/elles",f:'vont'}];
const verbesFaire=[{p:'je',f:'fais'},{p:'tu',f:'fais'},{p:'il/elle',f:'fait'},{p:'nous',f:'faisons'},{p:'vous',f:'faites'},{p:"ils/elles",f:'font'}];

const phrases1=[
  {q:'Complète : "Je ___ un élève."',ans:'suis',choices:['suis','es','est','ont'],hint:'Verbe être'},
  {q:'Complète : "Tu ___ un livre."',ans:'as',choices:['ai','as','a','avons'],hint:'Verbe avoir'},
  {q:"Complète : \"Il ___ à l'école.\"",ans:'va',choices:['vais','vas','va','allons'],hint:'Verbe aller'},
  {q:"C'est quelle couleur ? 🔴",ans:'rouge',choices:['rouge','bleu','vert','jaune'],hint:'Couleur'},
  {q:"C'est quel animal ? 🐱",ans:'un chat',choices:['un chat','un chien','un lapin','un lion'],hint:'Animal'},
  {q:'C\'est quel chiffre ? "cinq"',ans:'5',choices:['3','4','5','6'],hint:'Chiffre en lettres'},
  {q:'Complète : "La ___ est belle."',ans:'fleur',choices:['fleur','arbre','soleil','nuage'],hint:'Féminin'},
  {q:'Quel article ? "___ chat"',ans:'le',choices:['le','la','les','une'],hint:'Article défini'},
  {q:'Quel article ? "___ maison"',ans:'la',choices:['le','la','les','un'],hint:'Article défini'},
  {q:"C'est quelle couleur ? 🟡",ans:'jaune',choices:['orange','jaune','vert','violet'],hint:'Couleur'},
];
const phrases2=[
  {q:'Conjuguez "avoir" avec "nous" :',ans:'avons',choices:['ai','avons','avez','ont'],hint:'Verbe avoir'},
  {q:'Conjuguez "être" avec "vous" :',ans:'êtes',choices:['sommes','sont','êtes','es'],hint:'Verbe être'},
  {q:'Quel est l\'opposé de "grand" ?',ans:'petit',choices:['petit','gros','fort','vieux'],hint:'Contraire'},
  {q:'Quel est l\'opposé de "chaud" ?',ans:'froid',choices:['froid','tiède','frais','sec'],hint:'Contraire'},
  {q:'Complète : "Nous ___ des amis."',ans:'avons',choices:['ai','as','avons','ont'],hint:'Verbe avoir'},
  {q:'Complète : "Ils ___ à la maison."',ans:'sont',choices:['suis','es','est','sont'],hint:'Verbe être'},
  {q:'Pluriel de "un chat" :',ans:'des chats',choices:['des chats','un chats','les chat','des chat'],hint:'Pluriel'},
  {q:'Pluriel de "une fleur" :',ans:'des fleurs',choices:['des fleurs','une fleurs','les fleur','des fleur'],hint:'Pluriel'},
  {q:'Quel jour vient après "lundi" ?',ans:'mardi',choices:['mardi','mercredi','jeudi','vendredi'],hint:'Jours'},
  {q:'Quel mois vient après "janvier" ?',ans:'février',choices:['février','mars','avril','mai'],hint:'Mois'},
];
const phrases3=[
  {q:'Conjuguez "faire" avec "ils" :',ans:'font',choices:['faisons','faites','font','fait'],hint:'Verbe faire'},
  {q:'Conjuguez "aller" avec "vous" :',ans:'allez',choices:['allons','allez','vont','vas'],hint:'Verbe aller'},
  {q:'Complète : "La maîtresse ___ la leçon."',ans:'explique',choices:['explique','expliques','expliquent','expliquons'],hint:'Conjugaison'},
  {q:'Quel est le féminin de "boulanger" ?',ans:'boulangère',choices:['boulangère','boulangeur','boulangeuse','boulangresse'],hint:'Féminin'},
  {q:'Pluriel de "un oiseau" :',ans:'des oiseaux',choices:['des oiseaux','des oiseaus','les oiseaux','des oiseau'],hint:'Pluriel -eaux'},
  {q:'Complète : "Les enfants ___ dans la cour."',ans:'jouent',choices:['joue','joues','jouent','jouons'],hint:'Pluriel verbe'},
  {q:'"Il fait beau" signifie :',ans:'Le temps est agréable',choices:['Le temps est agréable','Il fait froid','Il pleut','Il neige'],hint:'Expression'},
  {q:'Quel est le contraire de "propre" ?',ans:'sale',choices:['sale','beau','neuf','doux'],hint:'Contraire'},
  {q:'Complète : "Nous ___ au marché."',ans:'allons',choices:['allons','allez','vont','vais'],hint:'Verbe aller'},
  {q:'"Bonjour" est utilisé :',ans:'le matin',choices:['le matin','le soir','la nuit','après-midi'],hint:'Salutation'},
];

// ═══ STATE ═══
let currentGrade=1,currentTopic='alphabet',questions=[];
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
function pick(a,n){return shuffle(a).slice(0,n);}

// ── SPEECH (read questions + feedback aloud, French) ──
const speechAvailable = 'speechSynthesis' in window;
let ttsVoices = [];
function loadTtsVoices(){ if(!speechAvailable) return; ttsVoices = window.speechSynthesis.getVoices(); if(!ttsVoices.length) setTimeout(loadTtsVoices, 300); }
if(speechAvailable){ loadTtsVoices(); window.speechSynthesis.onvoiceschanged = loadTtsVoices; }
function getFrenchVoice(){
  const fresh = window.speechSynthesis.getVoices();
  if(fresh.length) ttsVoices = fresh;
  const byExactLang = code => ttsVoices.find(v=>v.lang.toLowerCase()===code);
  return byExactLang('fr-fr') || byExactLang('fr-ca') || byExactLang('fr-be') || byExactLang('fr-ch')
    || ttsVoices.find(v=>v.lang.toLowerCase().startsWith('fr'));
}
function hasFrenchVoice(){ return speechAvailable && !!getFrenchVoice(); }
function speak(text){
  if(!speechAvailable) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'fr-FR'; utt.rate = 0.88; utt.pitch = 1.05;
  const fr = getFrenchVoice();
  if(fr) utt.voice = fr;
  window.speechSynthesis.speak(utt);
}
function speakQuestion(qi){
  const q=questions[qi];
  if(!q) return;
  speak((q.big?q.big+'. ':'')+q.q);
}

document.querySelectorAll('.grade-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.grade-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');currentGrade=parseInt(btn.dataset.grade);sndClick();
  });
});
document.querySelectorAll('.topic-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.topic-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');currentTopic=btn.dataset.topic;sndClick();
  });
});

// ═══ GENERATE ═══
function generateQuestions(){
  const qs=[];
  if(currentTopic==='alphabet'){
    pick(alphabet,10).forEach(l=>{
      const type=rand(0,2);
      if(type===0){
        const wrong=pick(alphabet.filter(x=>x!==l),3).map(x=>alphaNames[x]);
        qs.push({type:'mc',big:l,q:`Comment s'appelle cette lettre ?`,ans:alphaNames[l],choices:shuffle([alphaNames[l],...wrong]),hint:'Nom de la lettre'});
      } else if(type===1){
        const idx=alphabet.indexOf(l);
        if(idx<alphabet.length-1){
          const next=alphabet[idx+1];
          const wrong=pick(alphabet.filter(x=>x!==next),3);
          qs.push({type:'mc',big:l,q:`Quelle lettre vient après "${l}" ?`,ans:next,choices:shuffle([next,...wrong]),hint:'Ordre alphabétique'});
        } else {
          const wrong=pick(alphabet.filter(x=>x!==l),3).map(x=>alphaNames[x]);
          qs.push({type:'mc',big:l,q:`Comment s'appelle cette lettre ?`,ans:alphaNames[l],choices:shuffle([alphaNames[l],...wrong]),hint:'Nom de la lettre'});
        }
      } else {
        const name=alphaNames[l];
        const wrong=pick(Object.values(alphaNames).filter(x=>x!==name),3);
        qs.push({type:'mc',big:l,q:`Quel mot correspond à "${l}" ?`,ans:name,choices:shuffle([name,...wrong]),hint:'Mot exemple'});
      }
    });
  } else if(currentTopic==='vocab'){
    const subtype=rand(0,3);
    if(subtype===0){
      pick(vocabCouleurs,10).forEach(c=>{
        const wrong=pick(vocabCouleurs.filter(x=>x!==c),3).map(x=>x.fr);
        qs.push({type:'mc',big:c.emoji,q:`C'est quelle couleur ?`,ans:c.fr,choices:shuffle([c.fr,...wrong]),hint:'Couleur'});
      });
    } else if(subtype===1){
      pick(vocabAnimaux,10).forEach(a=>{
        const wrong=pick(vocabAnimaux.filter(x=>x!==a),3).map(x=>x.fr);
        qs.push({type:'mc',big:a.img,q:`C'est quel animal ?`,ans:a.fr,choices:shuffle([a.fr,...wrong]),hint:'Animal'});
      });
    } else if(subtype===2){
      pick(vocabChiffres,10).forEach(c=>{
        if(rand(0,1)===0){
          const wrong=pick(vocabChiffres.filter(x=>x!==c),3).map(x=>x.fr);
          qs.push({type:'mc',big:String(c.n),q:`Comment dit-on "${c.n}" en français ?`,ans:c.fr,choices:shuffle([c.fr,...wrong]),hint:'Chiffre → lettres'});
        } else {
          const wrong=pick(vocabChiffres.filter(x=>x!==c),3).map(x=>String(x.n));
          qs.push({type:'mc',big:c.fr,q:`Quel est ce chiffre ?`,ans:String(c.n),choices:shuffle([String(c.n),...wrong]),hint:'Lettres → chiffre'});
        }
      });
    } else {
      pick(vocabFamille,8).forEach(f=>{
        const wrong=pick(vocabFamille.filter(x=>x!==f),3).map(x=>x.fr);
        qs.push({type:'mc',big:f.emoji,q:`Quel membre de la famille ?`,ans:f.fr,choices:shuffle([f.fr,...wrong]),hint:'Famille'});
      });
    }
  } else if(currentTopic==='genre'){
    pick(genrePairs,10).forEach(pair=>{
      if(rand(0,1)===0){
        const wrong=pick(genrePairs.filter(x=>x!==pair),3).map(x=>x.f);
        qs.push({type:'mc',q:`Quel est le féminin de "${pair.m}" ?`,ans:pair.f,choices:shuffle([pair.f,...wrong]),hint:'Masculin → Féminin'});
      } else {
        const wrong=pick(genrePairs.filter(x=>x!==pair),3).map(x=>x.m);
        qs.push({type:'mc',q:`Quel est le masculin de "${pair.f}" ?`,ans:pair.m,choices:shuffle([pair.m,...wrong]),hint:'Féminin → Masculin'});
      }
    });
  } else if(currentTopic==='verbes'){
    const allVerbs=[
      {name:'être',conj:verbesEtre},{name:'avoir',conj:verbesAvoir},
      {name:'aller',conj:verbesAller},{name:'faire',conj:verbesFaire}
    ];
    const verbs=currentGrade===1?[allVerbs[0],allVerbs[1]]:allVerbs;
    for(let i=0;i<10;i++){
      const v=verbs[rand(0,verbs.length-1)];
      const form=v.conj[rand(0,v.conj.length-1)];
      const allForms=v.conj.map(x=>x.f);
      const wrong=pick(allForms.filter(x=>x!==form.f),3);
      qs.push({type:'mc',q:`Conjuguez "${v.name}" avec "${form.p}" :`,ans:form.f,choices:shuffle([form.f,...wrong]),hint:`Verbe ${v.name}`});
    }
  } else if(currentTopic==='phrases'){
    const pool=currentGrade===1?phrases1:currentGrade===2?phrases2:phrases3;
    pick(pool,Math.min(10,pool.length)).forEach(p=>{
      qs.push({type:'mc',q:p.q,ans:p.ans,choices:shuffle(p.choices),hint:p.hint});
    });
  }
  return qs.slice(0,10).map((q,i)=>({...q,id:i,answered:false,userAns:null}));
}

// ═══ LABELS ═══
const topicNames={alphabet:'Alphabet',vocab:'Vocabulaire',genre:'Genre',verbes:'Verbes',phrases:'Phrases'};
const topicEmojis={alphabet:'🔤',vocab:'📖',genre:'⚖️',verbes:'✏️',phrases:'💬'};
const gradeNames={1:'CE1',2:'CE2',3:'CM1'};

// ═══ MAIN FUNCTIONS ═══
function startWorksheet(){
  sndStart();
  questions=generateQuestions();
  const name=document.getElementById('studentName').value.trim();
  document.getElementById('ws-title').textContent=`${topicEmojis[currentTopic]} Fiche ${topicNames[currentTopic]}`;
  document.getElementById('ws-grade-badge').textContent=gradeNames[currentGrade];
  document.getElementById('ws-topic-badge').textContent=`${topicEmojis[currentTopic]} ${topicNames[currentTopic]}`;
  document.getElementById('ws-student-label').textContent=name?`👤 ${name}`:'';
  document.getElementById('score-val').textContent='0';
  document.getElementById('score-total').textContent=questions.length;
  document.getElementById('answered-count').textContent='0';
  document.getElementById('progress-fill').style.width='0%';
  document.getElementById('result-panel').style.display='none';
  renderQuestions();
  const area=document.getElementById('worksheet-area');
  area.style.display='block';
  setTimeout(()=>area.scrollIntoView({behavior:'smooth',block:'start'}),100);
  if(hasFrenchVoice()) setTimeout(()=>speakQuestion(0),700);
}

function renderQuestions(){
  const grid=document.getElementById('questions-grid');
  grid.innerHTML='';
  const showSpeaker=hasFrenchVoice();
  questions.forEach((q,i)=>{
    const card=document.createElement('div');
    card.className='q-card';card.id=`card-${i}`;
    const bigHtml=q.big?`<div class="q-big">${q.big}</div>`:'';
    const choicesHtml=`<div class="choices">${q.choices.map(c=>`<button class="choice-btn" onclick="selectChoice(${i},'${c.replace(/'/g,"\\'")}')">${c}</button>`).join('')}</div>`;
    const speakerHtml=showSpeaker?` <button type="button" onclick="speakQuestion(${i})" title="Écouter" style="border:none;background:#f4f0ff;color:#6c3fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;vertical-align:middle;">🔊</button>`:'';
    card.innerHTML=`<span class="q-number">${i+1}</span>${bigHtml}<div class="q-question">${q.q}${speakerHtml}</div>${choicesHtml}<div class="q-feedback" id="fb-${i}"></div><div class="hint-text">💡 ${q.hint}</div>`;
    grid.appendChild(card);
  });
}

function selectChoice(qi,choice){
  const q=questions[qi];if(q.answered)return;
  q.userAns=choice;
  document.querySelectorAll(`#card-${qi} .choice-btn`).forEach(btn=>{
    btn.classList.remove('selected');
    if(btn.textContent.trim()===choice)btn.classList.add('selected');
  });
  document.getElementById('answered-count').textContent=questions.filter(q=>q.userAns).length;
  sndClick();
}

function checkAll(){
  let correct=0;
  questions.forEach((q,i)=>{
    const card=document.getElementById(`card-${i}`);
    const fb=document.getElementById(`fb-${i}`);
    card.classList.remove('correct','wrong');
    if(!q.userAns){fb.textContent='✏️ Pas encore répondu';fb.style.color='var(--sub)';return;}
    q.answered=true;
    const ok=q.userAns===q.ans;
    document.querySelectorAll(`#card-${i} .choice-btn`).forEach(btn=>{
      btn.disabled=true;
      const t=btn.textContent.trim();
      if(t===q.ans)btn.classList.add('correct-choice');
      else if(t===q.userAns&&!ok)btn.classList.add('wrong-choice');
    });
    if(ok){card.classList.add('correct');fb.textContent='✅ Bravo !';fb.style.color='var(--mint)';correct++;spawnStar(card);}
    else{card.classList.add('wrong');fb.textContent=`❌ Réponse : ${q.ans}`;fb.style.color='var(--rose)';}
  });
  document.getElementById('score-val').textContent=correct;
  document.getElementById('progress-fill').style.width=(correct/questions.length*100)+'%';
  showResult(correct,questions.length);
}

function showResult(score,total){
  const pct=score/total;
  let emoji,msg,stars;
  if(pct===1){emoji='🏆';msg='Parfait ! Tu es une étoile ! 🌟';stars='⭐⭐⭐';sndWin();confetti();}
  else if(pct>=.8){emoji='🎉';msg='Excellent ! Très bon travail !';stars='⭐⭐⭐';sndWin();confetti();}
  else if(pct>=.6){emoji='👍';msg='Bien ! Essaie encore !';stars='⭐⭐';sndCorrect();}
  else if(pct>=.4){emoji='💪';msg='Continue à essayer !';stars='⭐';sndCorrect();}
  else{emoji='📖';msg='Révise la leçon et réessaie !';stars='';sndWrong();}
  document.getElementById('result-emoji').textContent=emoji;
  document.getElementById('result-stars').textContent=stars;
  document.getElementById('result-score').textContent=`${score} / ${total}`;
  document.getElementById('result-msg').textContent=msg;
  const name=document.getElementById('studentName').value.trim();
  document.getElementById('result-name').textContent=name?`🌟 Bravo, ${name} !`:'';
  if(hasFrenchVoice()) speak(`${msg} Tu as obtenu ${score} sur ${total}.`);
  const panel=document.getElementById('result-panel');
  panel.style.display='block';
  setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'center'}),100);
}

function resetAll(){
  questions.forEach((q,i)=>{
    q.userAns=null;q.answered=false;
    const card=document.getElementById(`card-${i}`);
    card.classList.remove('correct','wrong');
    document.getElementById(`fb-${i}`).textContent='';
    card.querySelectorAll('.choice-btn').forEach(btn=>{btn.classList.remove('selected','correct-choice','wrong-choice');btn.disabled=false;});
  });
  document.getElementById('score-val').textContent='0';
  document.getElementById('progress-fill').style.width='0%';
  document.getElementById('answered-count').textContent='0';
  document.getElementById('result-panel').style.display='none';
  sndClick();
}

function spawnStar(el){
  const rect=el.getBoundingClientRect();
  const star=document.createElement('div');star.className='float-star';
  star.textContent=['⭐','✨','🌟'][Math.floor(Math.random()*3)];
  star.style.left=(rect.left+rect.width/2-14)+'px';
  star.style.top=(rect.top+window.scrollY)+'px';
  document.body.appendChild(star);setTimeout(()=>star.remove(),1300);
}

function confetti(){
  const cols=['#c084fc','#f472b6','#43e97b','#4fc3f7','#f9c74f','#f95d6a','#00b4d8'];
  for(let i=0;i<22;i++){
    const p=document.createElement('div');p.className='confetti-p';
    p.style.left=Math.random()*100+'vw';p.style.top='0';
    p.style.background=cols[Math.floor(Math.random()*cols.length)];
    p.style.animationDuration=(1.2+Math.random()*.8)+'s';
    p.style.animationDelay=Math.random()*.4+'s';
    p.style.borderRadius=Math.random()>.5?'50%':'3px';
    document.body.appendChild(p);setTimeout(()=>p.remove(),2200);
  }
}
