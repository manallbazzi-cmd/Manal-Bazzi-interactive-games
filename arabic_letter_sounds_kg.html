<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>أسمع الحرف - روضة الأطفال - المعلمة منال بزي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Times New Roman',Times,serif;
  background:linear-gradient(135deg,#FFF5FB,#F0F8FF,#FFFBF0);
  min-height:100vh;color:#3A3A5C;
  overflow-x:hidden;direction:rtl;
}

/* ── HEADER ── */
header{
  background:linear-gradient(90deg,#FF6B9D,#C44DFF,#4D94FF);
  color:#fff;text-align:center;
  padding:16px 16px 12px;
  position:relative;overflow:hidden;
}
header::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;background:rgba(255,255,255,.12);border-radius:50%;}
header::after{content:'';position:absolute;bottom:-30px;left:-20px;width:90px;height:90px;background:rgba(255,255,255,.08);border-radius:50%;}
.h-title{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:900;text-shadow:2px 3px 0 rgba(0,0,0,.15);}
.h-sub{font-size:.85rem;opacity:.92;margin-top:4px;font-weight:700;}
.h-stars{font-size:1.2rem;margin-top:4px;letter-spacing:3px;}

/* ── SCORE BAR ── */
.scorebar{
  background:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.score-box{
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#FFF0F8,#F0EEFF);
  border-radius:50px;padding:6px 16px;
  font-weight:900;font-size:1rem;color:#C44DFF;
}
.progress-wrap{flex:1;background:#EEE;border-radius:50px;height:12px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#FF6B9D,#C44DFF);border-radius:50px;transition:width .5s ease;}
.q-counter{font-size:.85rem;font-weight:700;color:#888;white-space:nowrap;}

/* ── MAIN ── */
.main{max-width:600px;margin:0 auto;padding:20px 14px 80px;}

/* ── GAME CARD ── */
.game-card{
  background:#fff;border-radius:28px;
  box-shadow:0 10px 40px rgba(0,0,0,.1);
  padding:28px 20px;margin-bottom:20px;
  text-align:center;
}

.instruction{
  font-size:1rem;font-weight:700;color:#888;
  margin-bottom:18px;
  background:linear-gradient(135deg,#FFF0F8,#F0EEFF);
  border-radius:14px;padding:10px 16px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}

/* ── SPEAKER BUTTON ── */
.speaker-btn{
  width:150px;height:150px;border-radius:50%;
  border:none;cursor:pointer;
  background:linear-gradient(135deg,#FF6B9D,#C44DFF);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin:0 auto 24px;
  box-shadow:0 8px 30px rgba(196,77,255,.4);
  transition:transform .15s,box-shadow .15s;
  position:relative;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.speaker-btn:active{transform:scale(.93);box-shadow:0 4px 16px rgba(196,77,255,.3);}
.speaker-btn.playing{animation:pulse 0.6s ease-in-out infinite alternate;}
@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.06);}}
.speaker-icon{font-size:3.5rem;line-height:1;}
.speaker-label{font-size:.78rem;color:rgba(255,255,255,.9);font-weight:700;margin-top:4px;}

/* ── CHOICES ── */
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:8px;
}
.choice{
  aspect-ratio:1;
  border-radius:22px;
  border:4px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;
  transition:transform .2s,box-shadow .2s,border-color .2s;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  position:relative;overflow:hidden;
}
.choice:active{transform:scale(1.06);}
.choice.idle{
  background:#fff;
  border-color:#E8E8F0;
  box-shadow:0 4px 16px rgba(0,0,0,.07);
}
.choice.idle:hover{border-color:#C44DFF;transform:scale(1.04);}
.choice.correct{
  background:linear-gradient(135deg,#D4FAE8,#A8F0CC)!important;
  border-color:#22C55E!important;
  animation:popIn .35s cubic-bezier(.34,1.56,.64,1);
}
.choice.wrong{
  background:linear-gradient(135deg,#FFECEC,#FFD0D0)!important;
  border-color:#EF4444!important;
  animation:shake .35s ease;
}
.choice.disabled{pointer-events:none;opacity:.55;}
@keyframes popIn{from{transform:scale(.7);}to{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

.choice-letter{
  font-size:clamp(2.6rem,11vw,4rem);
  font-weight:900;line-height:1;
  font-family:'Times New Roman',Times,serif;
}
.choice-name{
  font-size:clamp(.6rem,2.5vw,.85rem);
  font-weight:700;margin-top:6px;
  color:#888;font-family:'Times New Roman',Times,serif;
}

/* Overlay emoji on correct/wrong */
.choice .overlay{
  position:absolute;top:6px;left:6px;
  font-size:1.4rem;
  display:none;
}
.choice.correct .overlay{display:block;}
.choice.wrong .overlay{display:block;}

/* ── FEEDBACK ── */
.feedback{
  min-height:42px;text-align:center;
  font-size:1.1rem;font-weight:900;
  margin:14px 0;
  transition:all .3s;
}
.feedback.good{color:#22C55E;}
.feedback.bad{color:#EF4444;}

/* ── NEXT BTN ── */
.next-btn{
  border:none;border-radius:50px;
  padding:14px 40px;
  font-family:'Times New Roman',Times,serif;
  font-size:1.1rem;font-weight:900;
  cursor:pointer;
  background:linear-gradient(135deg,#FF6B9D,#C44DFF);
  color:#fff;
  box-shadow:0 6px 20px rgba(196,77,255,.35);
  transition:transform .15s,opacity .2s;
  display:none;
  margin:0 auto;
}
.next-btn:active{transform:scale(.96);}
.next-btn.visible{display:block;}

/* ── RESULT SCREEN ── */
.result-screen{
  display:none;
  background:#fff;border-radius:28px;
  box-shadow:0 10px 40px rgba(0,0,0,.1);
  padding:36px 24px;
  text-align:center;
}
.result-screen.visible{display:block;animation:popIn .5s ease;}
.result-trophy{font-size:5rem;margin-bottom:12px;}
.result-title{font-size:1.8rem;font-weight:900;color:#C44DFF;margin-bottom:8px;}
.result-score{font-size:1.1rem;color:#666;margin-bottom:24px;}
.result-stars{font-size:2rem;letter-spacing:6px;margin-bottom:24px;}
.restart-btn{
  border:none;border-radius:50px;
  padding:14px 44px;
  font-size:1.1rem;font-weight:900;
  cursor:pointer;
  background:linear-gradient(135deg,#FF6B9D,#C44DFF);
  color:#fff;
  box-shadow:0 6px 20px rgba(196,77,255,.35);
  font-family:'Times New Roman',Times,serif;
}

/* ── CONFETTI ── */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;}
.confetti-piece{
  position:absolute;top:-20px;
  width:10px;height:14px;
  border-radius:3px;
  animation:fall linear forwards;
}
@keyframes fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0;}
}

/* ── colors for letter tiles ── */
.lc0{background:linear-gradient(135deg,#FF6B9D,#FF9EC0);}
.lc1{background:linear-gradient(135deg,#C44DFF,#D97BFF);}
.lc2{background:linear-gradient(135deg,#4D94FF,#7AB3FF);}
.lc3{background:linear-gradient(135deg,#FFB830,#FFCE70);}
.lc4{background:linear-gradient(135deg,#22C55E,#4EDE84);}
.lc5{background:linear-gradient(135deg,#FF5757,#FF8585);}
</style>
</head>
<body>

<header>
  <div class="h-title">🎧 أسمع الحرف!</div>
  <div class="h-sub">المعلمة منال بزي — روضة الأطفال</div>
  <div class="h-stars">⭐ ⭐ ⭐</div>
</header>

<div class="scorebar">
  <div class="score-box">⭐ <span id="scoreVal">0</span></div>
  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="q-counter" id="qCounter">1 / 28</div>
</div>

<div class="main">
  <div class="game-card" id="gameCard">
    <div class="instruction">👂 اضغط على السماعة واستمع، ثم اختر الحرف الصحيح!</div>

    <button class="speaker-btn" id="speakerBtn" onclick="playLetterSound()">
      <span class="speaker-icon">🔊</span>
      <span class="speaker-label">اضغط للسماع</span>
    </button>

    <div class="choices" id="choicesGrid"></div>

    <div class="feedback" id="feedback"></div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">التالي ←</button>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="result-trophy" id="resultTrophy">🏆</div>
    <div class="result-title" id="resultTitle">أحسنت!</div>
    <div class="result-stars" id="resultStars">⭐⭐⭐</div>
    <div class="result-score" id="resultScore"></div>
    <button class="restart-btn" onclick="startGame()">🔄 العب مجدداً</button>
  </div>
</div>

<div class="confetti-wrap" id="confettiWrap"></div>

<script>
// ── Arabic letters data ──────────────────────────────────
const LETTERS = [
  {letter:'أ', name:'ألف',    word:'أسد'},
  {letter:'ب', name:'باء',    word:'بطة'},
  {letter:'ت', name:'تاء',    word:'تفاحة'},
  {letter:'ث', name:'ثاء',    word:'ثعلب'},
  {letter:'ج', name:'جيم',    word:'جمل'},
  {letter:'ح', name:'حاء',    word:'حصان'},
  {letter:'خ', name:'خاء',    word:'خروف'},
  {letter:'د', name:'دال',    word:'دجاجة'},
  {letter:'ذ', name:'ذال',    word:'ذئب'},
  {letter:'ر', name:'راء',    word:'رمانة'},
  {letter:'ز', name:'زاي',    word:'زرافة'},
  {letter:'س', name:'سين',    word:'سمكة'},
  {letter:'ش', name:'شين',    word:'شمس'},
  {letter:'ص', name:'صاد',    word:'صقر'},
  {letter:'ض', name:'ضاد',    word:'ضفدع'},
  {letter:'ط', name:'طاء',    word:'طاووس'},
  {letter:'ظ', name:'ظاء',    word:'ظبي'},
  {letter:'ع', name:'عين',    word:'عصفور'},
  {letter:'غ', name:'غين',    word:'غزال'},
  {letter:'ف', name:'فاء',    word:'فيل'},
  {letter:'ق', name:'قاف',    word:'قطة'},
  {letter:'ك', name:'كاف',    word:'كلب'},
  {letter:'ل', name:'لام',    word:'ليمون'},
  {letter:'م', name:'ميم',    word:'موز'},
  {letter:'ن', name:'نون',    word:'نملة'},
  {letter:'ه', name:'هاء',    word:'هرة'},
  {letter:'و', name:'واو',    word:'وردة'},
  {letter:'ي', name:'ياء',    word:'يمامة'},
];

const COLORS = ['lc0','lc1','lc2','lc3','lc4','lc5'];
const CONF_COLORS = ['#FF6B9D','#C44DFF','#4D94FF','#FFB830','#22C55E','#FF5757','#fff'];

let order = [];
let qi = 0;
let score = 0;
let answered = false;
let synth = window.speechSynthesis;
let arabicVoice = null;

// ── Find Arabic voice ─────────────────────────────────────
function loadVoices() {
  const voices = synth.getVoices();
  arabicVoice = voices.find(v => v.lang.startsWith('ar')) || null;
}
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
loadVoices();

// ── Shuffle ───────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── Start / Restart ───────────────────────────────────────
function startGame() {
  order = shuffle(LETTERS);
  qi = 0; score = 0; answered = false;
  document.getElementById('resultScreen').classList.remove('visible');
  document.getElementById('gameCard').style.display = '';
  document.getElementById('confettiWrap').innerHTML = '';
  updateScore();
  loadQuestion();
}

// ── Load question ─────────────────────────────────────────
function loadQuestion() {
  answered = false;
  const correct = order[qi];

  // Pick 3 wrong distractors
  let pool = LETTERS.filter(l => l.letter !== correct.letter);
  pool = shuffle(pool).slice(0, 3);
  let options = shuffle([correct, ...pool]);

  // Update progress
  updateScore();

  // Render choices
  const grid = document.getElementById('choicesGrid');
  grid.innerHTML = '';
  options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = `choice idle ${COLORS[i % COLORS.length]}`;
    div.innerHTML = `
      <span class="overlay" id="ov${i}">${opt.letter === correct.letter ? '✅' : '❌'}</span>
      <span class="choice-letter" style="color:#fff">${opt.letter}</span>
      <span class="choice-name" style="color:rgba(255,255,255,.85)">${opt.name}</span>
    `;
    div.onclick = () => handleChoice(div, opt.letter === correct.letter, i, options.length);
    grid.appendChild(div);
  });

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').classList.remove('visible');

  // Auto-play after short delay
  setTimeout(playLetterSound, 600);
}

// ── Play sound via SpeechSynthesis ────────────────────────
function playLetterSound() {
  synth.cancel();
  const correct = order[qi];
  const btn = document.getElementById('speakerBtn');

  // Speak the letter name in Arabic
  const utt = new SpeechSynthesisUtterance(correct.name);
  utt.lang = 'ar-SA';
  utt.rate = 0.82;
  utt.pitch = 1.1;
  if (arabicVoice) utt.voice = arabicVoice;

  utt.onstart  = () => btn.classList.add('playing');
  utt.onend    = () => btn.classList.remove('playing');
  utt.onerror  = () => btn.classList.remove('playing');

  synth.speak(utt);
  playTick();
}

// ── Handle choice ─────────────────────────────────────────
function handleChoice(el, isCorrect, idx, total) {
  if (answered) return;
  answered = true;

  // Disable all
  document.querySelectorAll('.choice').forEach(c => c.classList.add('disabled'));

  if (isCorrect) {
    el.classList.remove('idle');
    el.classList.add('correct');
    score++;
    document.getElementById('feedback').textContent = shuffle(['رائع! 🌟','ممتاز! 🎉','أحسنت! 👏','صحيح! ✅','بالضبط! 🥳'])[0];
    document.getElementById('feedback').className = 'feedback good';
    playCorrect();
    if (score % 5 === 0) spawnConfetti();
  } else {
    el.classList.remove('idle');
    el.classList.add('wrong');
    // Highlight correct
    document.querySelectorAll('.choice').forEach(c => {
      const lbl = c.querySelector('.choice-letter');
      if (lbl && lbl.textContent === order[qi].letter) {
        c.classList.remove('idle','disabled');
        c.classList.add('correct');
      }
    });
    document.getElementById('feedback').textContent = 'حاول مرة أخرى! 💪';
    document.getElementById('feedback').className = 'feedback bad';
    playWrong();
  }

  updateScore();

  const isLast = qi === order.length - 1;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = isLast ? '🏆 النتيجة' : 'التالي ←';
  nextBtn.classList.add('visible');
}

// ── Next question ─────────────────────────────────────────
function nextQuestion() {
  qi++;
  if (qi >= order.length) {
    showResult();
  } else {
    loadQuestion();
  }
}

// ── Update score display ──────────────────────────────────
function updateScore() {
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('qCounter').textContent = `${qi + 1} / ${order.length}`;
  const pct = (qi / order.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

// ── Show result ───────────────────────────────────────────
function showResult() {
  document.getElementById('gameCard').style.display = 'none';
  const rs = document.getElementById('resultScreen');
  rs.classList.add('visible');

  const pct = score / order.length;
  let trophy = '🏆', title = 'أحسنت!', stars = '⭐⭐⭐';
  if (pct < 0.5) { trophy = '😊'; title = 'حاول مجدداً!'; stars = '⭐'; }
  else if (pct < 0.75) { trophy = '🌟'; title = 'جيد جداً!'; stars = '⭐⭐'; }

  document.getElementById('resultTrophy').textContent = trophy;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultStars').textContent = stars;
  document.getElementById('resultScore').textContent = `أجبت صحيحاً على ${score} من ${order.length} سؤال`;

  spawnConfetti();
  playComplete();
}

// ── Audio helpers (Web Audio API) ────────────────────────
let audioCtx = null;
function getACtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, type, dur, vol, t, ctx) {
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.connect(g); g.connect(ctx.destination);
  osc.type = type; osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.start(t); osc.stop(t + dur);
}
function playCorrect() {
  try {
    const c = getACtx(), t = c.currentTime;
    [523,659,784,1047].forEach((f,i) => tone(f,'sine',.2,.2,t+i*.1,c));
  } catch(e){}
}
function playWrong() {
  try {
    const c = getACtx(), t = c.currentTime;
    tone(200,'sawtooth',.12,.18,t,c);
    tone(160,'sawtooth',.12,.18,t+.13,c);
  } catch(e){}
}
function playComplete() {
  try {
    const c = getACtx(), t = c.currentTime;
    [[523,0],[659,.1],[784,.2],[1047,.32],[784,.44],[1047,.54],[1319,.64]]
      .forEach(([f,d]) => tone(f,'sine',.22,.28,t+d,c));
  } catch(e){}
}
function playTick() {
  try {
    const c = getACtx();
    tone(800,'sine',.06,.1,c.currentTime,c);
  } catch(e){}
}

// ── Confetti ──────────────────────────────────────────────
function spawnConfetti() {
  const wrap = document.getElementById('confettiWrap');
  for (let i = 0; i < 50; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `
      left:${Math.random()*100}%;
      background:${CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)]};
      width:${6+Math.random()*8}px;
      height:${8+Math.random()*10}px;
      animation-duration:${1.2+Math.random()*1.8}s;
      animation-delay:${Math.random()*.6}s;
      border-radius:${Math.random()>0.5?'50%':'3px'};
    `;
    wrap.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}

// ── Init ──────────────────────────────────────────────────
startGame();
</script>
</body>
</html>
