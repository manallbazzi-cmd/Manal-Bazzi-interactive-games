<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Letter Sounds – Teacher Manal Bazzi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');

:root{
  --purple:#6c3fff;
  --blue:#3a86ff;
  --green:#22c55e;
  --orange:#f97316;
  --pink:#f43f8a;
  --yellow:#fbbf24;
  --teal:#0bbfbf;
  --bg:#f0f4ff;
  --white:#fff;
  --dark:#1a1150;
  --sub:#6b7280;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

body{
  font-family:'Nunito',sans-serif;
  background:var(--bg);
  color:var(--dark);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}

/* ── HEADER ── */
header{
  background:linear-gradient(135deg,#6c3fff 0%,#3a86ff 60%,#0bbfbf 100%);
  padding:env(safe-area-inset-top, 0) 0 0;
  text-align:center;
  position:relative;
  overflow:hidden;
}
header::before{
  content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.06'%3E%3Ccircle cx='30' cy='30' r='30'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") repeat;
}
.header-inner{position:relative;padding:20px 16px 24px;}
.back-btn{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.2);border:none;color:#fff;
  width:38px;height:38px;border-radius:50%;font-size:1.1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  text-decoration:none;
}
.header-icon{font-size:clamp(2rem,8vw,3rem);margin-bottom:6px;animation:bounce 2s ease-in-out infinite;}
.header-title{font-size:clamp(1.3rem,5vw,2rem);font-weight:900;color:#fff;line-height:1.2;}
.header-sub{font-size:clamp(.75rem,3vw,.95rem);color:rgba(255,255,255,.85);margin-top:4px;font-weight:700;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ── MODE TABS ── */
.mode-tabs{
  display:flex;gap:8px;justify-content:center;
  padding:16px 12px 8px;
  flex-wrap:wrap;
}
.mode-tab{
  padding:9px 20px;border-radius:50px;
  border:2px solid #e5e7eb;background:#fff;
  font-size:clamp(.78rem,3vw,.9rem);font-weight:800;
  color:var(--sub);cursor:pointer;transition:all .2s;
  font-family:'Nunito',sans-serif;
}
.mode-tab.active{background:var(--purple);border-color:var(--purple);color:#fff;}

/* ── MAIN DISPLAY (active letter) ── */
.display-section{
  display:flex;flex-direction:column;align-items:center;
  padding:16px 16px 8px;
  max-width:480px;margin:0 auto;
}
.letter-display{
  width:min(220px,55vw);height:min(220px,55vw);
  border-radius:28px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  position:relative;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.15);
  user-select:none;
}
.letter-display:active{transform:scale(.94);}
.letter-display.playing{animation:pulse .4s ease;}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

.letter-big{
  font-size:clamp(4rem,18vw,7rem);
  font-weight:900;color:#fff;line-height:1;
  text-shadow:0 4px 12px rgba(0,0,0,.2);
}
.letter-small{
  font-size:clamp(1.8rem,7vw,3rem);
  font-weight:800;color:rgba(255,255,255,.75);
  line-height:1;
}
.tap-hint{
  position:absolute;bottom:10px;
  font-size:.65rem;font-weight:800;color:rgba(255,255,255,.7);
  letter-spacing:.5px;text-transform:uppercase;
}

.word-card{
  background:#fff;border-radius:20px;
  padding:14px 24px;margin-top:14px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 4px 16px rgba(108,63,255,.12);
  width:100%;max-width:320px;
  cursor:pointer;transition:transform .15s;
}
.word-card:active{transform:scale(.97);}
.word-emoji{font-size:clamp(2rem,8vw,2.8rem);}
.word-text{flex:1;}
.word-name{font-size:clamp(1.2rem,5vw,1.6rem);font-weight:900;color:var(--dark);}
.word-phonics{font-size:clamp(.75rem,3vw,.9rem);color:var(--sub);font-weight:700;margin-top:2px;}

.sound-btn{
  margin-top:14px;
  background:var(--purple);color:#fff;
  border:none;border-radius:50px;
  padding:14px 36px;
  font-size:clamp(.95rem,4vw,1.1rem);font-weight:900;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:10px;
  font-family:'Nunito',sans-serif;
  box-shadow:0 4px 16px rgba(108,63,255,.3);
  width:100%;max-width:320px;justify-content:center;
}
.sound-btn:active{transform:scale(.96);}
.sound-btn.speaking{background:#22c55e;box-shadow:0 4px 16px rgba(34,197,94,.3);}

/* ── ALPHABET GRID ── */
.alphabet-section{
  max-width:600px;margin:16px auto 0;
  padding:0 12px 100px;
}
.section-title{
  text-align:center;font-size:clamp(.85rem,3.5vw,1rem);
  font-weight:800;color:var(--sub);
  text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:12px;
}
.alphabet-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(70px,19vw),1fr));
  gap:8px;
}
.letter-tile{
  aspect-ratio:1;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  user-select:none;
  position:relative;
}
.letter-tile:active{transform:scale(.9);}
.letter-tile.active-tile{
  box-shadow:0 0 0 3px var(--yellow),0 6px 20px rgba(0,0,0,.2);
  transform:scale(1.08);
}
.tile-letter{font-size:clamp(1.3rem,5vw,1.8rem);font-weight:900;color:#fff;line-height:1;}
.tile-sub{font-size:clamp(.5rem,2vw,.65rem);color:rgba(255,255,255,.8);font-weight:700;margin-top:2px;}
.tile-check{
  position:absolute;top:4px;right:4px;
  width:16px;height:16px;border-radius:50%;
  background:rgba(255,255,255,.9);
  display:none;align-items:center;justify-content:center;
  font-size:.6rem;
}
.letter-tile.heard .tile-check{display:flex;}

/* ── AUTO PLAY BAR ── */
.autoplay-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:#fff;
  box-shadow:0 -4px 20px rgba(0,0,0,.1);
  padding:12px 16px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom, 0));
  display:flex;gap:10px;align-items:center;justify-content:center;
  flex-wrap:wrap;
}
.bar-btn{
  border:none;border-radius:50px;
  padding:11px 22px;
  font-size:clamp(.82rem,3.5vw,.95rem);font-weight:800;
  cursor:pointer;transition:all .2s;
  font-family:'Nunito',sans-serif;
  display:flex;align-items:center;gap:7px;
}
.bar-btn:active{transform:scale(.95);}
.btn-play{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(34,197,94,.3);}
.btn-pause{background:var(--orange);color:#fff;box-shadow:0 4px 12px rgba(249,115,22,.3);}
.btn-prev{background:#f3f4f6;color:var(--dark);}
.btn-next{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(58,134,255,.3);}
.btn-repeat{background:#f5f0ff;color:var(--purple);}
.progress-bar{
  width:100%;background:#e5e7eb;border-radius:50px;height:6px;
  order:-1;
}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));border-radius:50px;transition:width .3s;}

/* ── QUIZ MODE ── */
.quiz-section{
  max-width:480px;margin:16px auto 0;padding:0 16px 100px;
}
.quiz-question{
  background:#fff;border-radius:24px;
  padding:24px 20px;text-align:center;
  box-shadow:0 4px 20px rgba(108,63,255,.1);
  margin-bottom:16px;
}
.quiz-prompt{font-size:clamp(.9rem,4vw,1.1rem);font-weight:800;color:var(--sub);margin-bottom:12px;}
.quiz-letter{
  font-size:clamp(4rem,18vw,7rem);font-weight:900;
  line-height:1;margin:8px 0;
}
.quiz-emoji{font-size:clamp(2.5rem,10vw,3.5rem);margin:8px 0;}
.quiz-options{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-bottom:16px;
}
.quiz-opt{
  background:#fff;border:3px solid #e5e7eb;
  border-radius:16px;padding:16px 8px;
  text-align:center;font-size:clamp(1.3rem,5vw,1.8rem);
  font-weight:900;cursor:pointer;
  transition:all .2s;font-family:'Nunito',sans-serif;
  color:var(--dark);
}
.quiz-opt:active{transform:scale(.95);}
.quiz-opt.correct{background:#ecfdf5;border-color:var(--green);color:var(--green);}
.quiz-opt.wrong{background:#fef2f2;border-color:#ef4444;color:#ef4444;animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.quiz-score{
  display:flex;justify-content:center;gap:20px;margin-bottom:16px;
}
.score-item{
  background:#fff;border-radius:16px;padding:10px 20px;
  text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.07);
}
.score-num{font-size:1.5rem;font-weight:900;}
.score-label{font-size:.7rem;font-weight:700;color:var(--sub);}

/* ── FEEDBACK TOAST ── */
.toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:var(--dark);color:#fff;
  padding:10px 24px;border-radius:50px;
  font-size:.9rem;font-weight:800;
  opacity:0;transition:all .3s;pointer-events:none;
  white-space:nowrap;z-index:999;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.correct-toast{background:var(--green);}
.toast.wrong-toast{background:#ef4444;}

/* ── NO SPEECH WARNING ── */
.no-speech{
  background:#fff3cd;border:2px solid #fbbf24;border-radius:16px;
  padding:12px 16px;margin:12px;text-align:center;
  font-size:.85rem;font-weight:700;color:#92400e;display:none;
}

/* ── RESPONSIVE TWEAKS ── */
@media(max-width:380px){
  .alphabet-grid{grid-template-columns:repeat(6,1fr);gap:5px;}
  .letter-tile{border-radius:10px;}
}
@media(min-width:601px){
  .alphabet-grid{grid-template-columns:repeat(9,1fr);}
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <a class="back-btn" href="index.html">←</a>
    <div class="header-icon">🔤</div>
    <div class="header-title">Letter Sounds</div>
    <div class="header-sub">Tap a letter to hear how it sounds!</div>
  </div>
</header>

<!-- NO SPEECH WARNING -->
<div class="no-speech" id="noSpeech">
  ⚠️ Your browser doesn't support audio. Please use Chrome or Safari for the best experience.
</div>

<!-- MODE TABS -->
<div class="mode-tabs">
  <button class="mode-tab active" onclick="setMode('explore')">🔤 Explore</button>
  <button class="mode-tab" onclick="setMode('quiz')">🎯 Quiz</button>
</div>

<!-- ══ EXPLORE MODE ══ -->
<div id="exploreMode">

  <!-- MAIN DISPLAY -->
  <div class="display-section">
    <div class="letter-display" id="letterDisplay" onclick="speakCurrent()" style="background:linear-gradient(135deg,#6c3fff,#3a86ff)">
      <div class="letter-big" id="displayBig">A</div>
      <div class="letter-small" id="displaySmall">a</div>
      <div class="tap-hint">Tap to hear!</div>
    </div>

    <div class="word-card" onclick="speakWord()">
      <div class="word-emoji" id="wordEmoji">🍎</div>
      <div class="word-text">
        <div class="word-name" id="wordName">Apple</div>
        <div class="word-phonics" id="wordPhonics">/æ/ — as in Apple</div>
      </div>
      <div style="font-size:1.4rem">🔊</div>
    </div>

    <button class="sound-btn" id="soundBtn" onclick="speakCurrent()">
      <span>🔊</span> Say the Letter!
    </button>
  </div>

  <!-- ALPHABET GRID -->
  <div class="alphabet-section">
    <div class="section-title">Tap any letter below</div>
    <div class="alphabet-grid" id="alphabetGrid"></div>
  </div>

</div>

<!-- ══ QUIZ MODE ══ -->
<div id="quizMode" style="display:none">
  <div class="quiz-section">
    <div class="quiz-score">
      <div class="score-item">
        <div class="score-num" id="qScore" style="color:var(--green)">0</div>
        <div class="score-label">✅ Correct</div>
      </div>
      <div class="score-item">
        <div class="score-num" id="qTotal" style="color:var(--purple)">0</div>
        <div class="score-label">📊 Total</div>
      </div>
      <div class="score-item">
        <div class="score-num" id="qStreak" style="color:var(--orange)">0</div>
        <div class="score-label">🔥 Streak</div>
      </div>
    </div>

    <div class="quiz-question">
      <div class="quiz-prompt" id="quizPrompt">Which letter makes this sound?</div>
      <div class="quiz-letter" id="quizLetter" style="display:none"></div>
      <div class="quiz-emoji" id="quizEmoji"></div>
      <button class="sound-btn" id="quizSoundBtn" onclick="playQuizSound()" style="margin:10px auto;max-width:240px">
        🔊 Hear the Sound
      </button>
    </div>

    <div class="quiz-options" id="quizOptions"></div>
    <div style="text-align:center">
      <button class="bar-btn btn-next" onclick="nextQuiz()" id="nextQuizBtn" style="display:inline-flex">
        Next Question →
      </button>
    </div>
  </div>
</div>

<!-- AUTO-PLAY BAR (explore only) -->
<div class="autoplay-bar" id="autoplayBar">
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:3.8%"></div>
  </div>
  <button class="bar-btn btn-prev" onclick="prevLetter()">◀ Prev</button>
  <button class="bar-btn btn-play" id="playBtn" onclick="toggleAutoPlay()">▶ Auto Play</button>
  <button class="bar-btn btn-next" onclick="nextLetter()">Next ▶</button>
  <button class="bar-btn btn-repeat" onclick="speakCurrent()">🔁 Repeat</button>
</div>

<!-- FEEDBACK TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── DATA ──
const LETTERS = [
  { l:'A', word:'Apple',   emoji:'🍎', phonics:'/æ/ — as in Apple',   color:['#ff6b6b','#ee5a24'] },
  { l:'B', word:'Ball',    emoji:'⚽', phonics:'/b/ — as in Ball',     color:['#ffa502','#ff7f50'] },
  { l:'C', word:'Cat',     emoji:'🐱', phonics:'/k/ — as in Cat',      color:['#f9ca24','#f0932b'] },
  { l:'D', word:'Dog',     emoji:'🐶', phonics:'/d/ — as in Dog',      color:['#6ab04c','#badc58'] },
  { l:'E', word:'Elephant',emoji:'🐘', phonics:'/ɛ/ — as in Elephant', color:['#22a6b3','#7ed6df'] },
  { l:'F', word:'Fish',    emoji:'🐟', phonics:'/f/ — as in Fish',     color:['#4834d4','#686de0'] },
  { l:'G', word:'Goat',    emoji:'🐐', phonics:'/g/ — as in Goat',     color:['#be2edd','#e056fd'] },
  { l:'H', word:'Hat',     emoji:'🎩', phonics:'/h/ — as in Hat',      color:['#d63031','#ff7675'] },
  { l:'I', word:'Igloo',   emoji:'🏠', phonics:'/ɪ/ — as in Igloo',   color:['#0984e3','#74b9ff'] },
  { l:'J', word:'Jar',     emoji:'🫙', phonics:'/dʒ/ — as in Jar',    color:['#00b894','#55efc4'] },
  { l:'K', word:'King',    emoji:'👑', phonics:'/k/ — as in King',     color:['#fd79a8','#e84393'] },
  { l:'L', word:'Lion',    emoji:'🦁', phonics:'/l/ — as in Lion',     color:['#fdcb6e','#e17055'] },
  { l:'M', word:'Moon',    emoji:'🌙', phonics:'/m/ — as in Moon',     color:['#6c5ce7','#a29bfe'] },
  { l:'N', word:'Nest',    emoji:'🪺', phonics:'/n/ — as in Nest',     color:['#00cec9','#81ecec'] },
  { l:'O', word:'Orange',  emoji:'🍊', phonics:'/ɒ/ — as in Orange',  color:['#e17055','#fab1a0'] },
  { l:'P', word:'Pen',     emoji:'✏️', phonics:'/p/ — as in Pen',      color:['#0652DD','#1289A7'] },
  { l:'Q', word:'Queen',   emoji:'👸', phonics:'/kw/ — as in Queen',   color:['#833471','#C84B31'] },
  { l:'R', word:'Rain',    emoji:'🌧️', phonics:'/r/ — as in Rain',     color:['#12CBC4','#FDA7DF'] },
  { l:'S', word:'Sun',     emoji:'☀️', phonics:'/s/ — as in Sun',      color:['#f9ca24','#F79F1F'] },
  { l:'T', word:'Tiger',   emoji:'🐯', phonics:'/t/ — as in Tiger',    color:['#ED4C67','#F79F1F'] },
  { l:'U', word:'Umbrella',emoji:'☂️', phonics:'/ʌ/ — as in Umbrella',color:['#1289A7','#006266'] },
  { l:'V', word:'Van',     emoji:'🚐', phonics:'/v/ — as in Van',      color:['#5758BB','#9980FA'] },
  { l:'W', word:'Whale',   emoji:'🐋', phonics:'/w/ — as in Whale',    color:['#0652DD','#C4E538'] },
  { l:'X', word:'X-ray',   emoji:'🦴', phonics:'/ks/ — as in X-ray',  color:['#833471','#EA2027'] },
  { l:'Y', word:'Yak',     emoji:'🦬', phonics:'/j/ — as in Yak',     color:['#F79F1F','#EE5A24'] },
  { l:'Z', word:'Zebra',   emoji:'🦓', phonics:'/z/ — as in Zebra',   color:['#1e3799','#0c2461'] },
];

// ── STATE ──
let currentIdx = 0;
let autoPlaying = false;
let autoTimer = null;
let quizScore = 0, quizTotal = 0, quizStreak = 0;
let currentQuiz = null;
let quizAnswered = false;
const heardSet = new Set();
let currentMode = 'explore';

// ── SPEECH ──
const synth = window.speechSynthesis;
let voices = [];
let speechSupported = !!synth;

function loadVoices(){
  voices = synth.getVoices();
  if (!voices.length) setTimeout(loadVoices, 200);
}
if (speechSupported) {
  loadVoices();
  synth.onvoiceschanged = loadVoices;
} else {
  document.getElementById('noSpeech').style.display = 'block';
}

function getBestVoice(){
  const pref = ['en-US','en-GB','en-AU','en'];
  for(const p of pref){
    const v = voices.find(v => v.lang.startsWith(p) && !v.name.includes('Google') === false || v.lang.startsWith(p));
    if(v) return v;
  }
  return voices[0] || null;
}

function speak(text, rate=0.85, pitch=1.1){
  if(!speechSupported) return;
  synth.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-US';
  utt.rate = rate;
  utt.pitch = pitch;
  utt.volume = 1;
  const v = getBestVoice();
  if(v) utt.voice = v;

  const btn = document.getElementById('soundBtn');
  utt.onstart = () => {
    if(btn){ btn.classList.add('speaking'); btn.innerHTML = '<span>🔊</span> Speaking...'; }
    document.getElementById('letterDisplay').classList.add('playing');
  };
  utt.onend = utt.onerror = () => {
    if(btn){ btn.classList.remove('speaking'); btn.innerHTML = '<span>🔊</span> Say the Letter!'; }
    document.getElementById('letterDisplay').classList.remove('playing');
  };
  synth.speak(utt);
}

function speakLetter(idx){
  const d = LETTERS[idx];
  // Say: "The letter A. A says /æ/. Apple!"
  speak(`The letter ${d.l}. ${d.l} says... ${d.word}!`, 0.82, 1.15);
}

function speakWord(){
  const d = LETTERS[currentIdx];
  speak(`${d.word}`, 0.85, 1.1);
}

function speakCurrent(){
  speakLetter(currentIdx);
  heardSet.add(currentIdx);
  document.querySelectorAll('.letter-tile').forEach((t,i)=>{
    if(i===currentIdx) t.classList.add('heard');
  });
}

// ── RENDER GRID ──
function buildGrid(){
  const grid = document.getElementById('alphabetGrid');
  grid.innerHTML = LETTERS.map((d,i)=>`
    <div class="letter-tile" id="tile${i}"
      style="background:linear-gradient(135deg,${d.color[0]},${d.color[1]})"
      onclick="selectLetter(${i})">
      <div class="tile-letter">${d.l}</div>
      <div class="tile-sub">${d.l.toLowerCase()}</div>
      <div class="tile-check">✓</div>
    </div>
  `).join('');
}

// ── SELECT LETTER ──
function selectLetter(idx){
  currentIdx = idx;
  updateDisplay();
  speakLetter(idx);
  heardSet.add(idx);
  document.querySelectorAll('.letter-tile').forEach((t,i)=>{
    t.classList.toggle('active-tile', i===idx);
    if(heardSet.has(i)) t.classList.add('heard');
  });
  document.getElementById('progressFill').style.width = ((idx+1)/26*100)+'%';
  // Scroll tile into view
  const tile = document.getElementById('tile'+idx);
  tile?.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function updateDisplay(){
  const d = LETTERS[currentIdx];
  document.getElementById('displayBig').textContent = d.l;
  document.getElementById('displaySmall').textContent = d.l.toLowerCase();
  document.getElementById('letterDisplay').style.background =
    `linear-gradient(135deg,${d.color[0]},${d.color[1]})`;
  document.getElementById('wordEmoji').textContent = d.emoji;
  document.getElementById('wordName').textContent = d.word;
  document.getElementById('wordPhonics').textContent = d.phonics;
}

// ── NAV ──
function prevLetter(){
  selectLetter((currentIdx - 1 + 26) % 26);
}
function nextLetter(){
  selectLetter((currentIdx + 1) % 26);
}

// ── AUTO PLAY ──
function toggleAutoPlay(){
  autoPlaying = !autoPlaying;
  const btn = document.getElementById('playBtn');
  if(autoPlaying){
    btn.className = 'bar-btn btn-pause';
    btn.textContent = '⏸ Pause';
    autoStep();
  } else {
    btn.className = 'bar-btn btn-play';
    btn.textContent = '▶ Auto Play';
    clearTimeout(autoTimer);
    synth?.cancel();
  }
}

function autoStep(){
  if(!autoPlaying) return;
  selectLetter(currentIdx);
  autoTimer = setTimeout(()=>{
    if(!autoPlaying) return;
    const next = (currentIdx+1)%26;
    if(next===0){
      toggleAutoPlay();
      showToast('🎉 Great job! All 26 letters done!', 'correct-toast');
      return;
    }
    currentIdx = next;
    autoStep();
  }, 2800);
}

// ── MODE ──
function setMode(m){
  currentMode = m;
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('exploreMode').style.display = m==='explore'?'':'none';
  document.getElementById('quizMode').style.display = m==='quiz'?'':'none';
  document.getElementById('autoplayBar').style.display = m==='explore'?'':'none';
  if(m==='quiz') initQuiz();
}

// ── QUIZ ──
const QUIZ_TYPES = ['hear-choose-letter','see-letter-choose-word','see-emoji-choose-letter'];

function initQuiz(){
  nextQuiz();
}

function nextQuiz(){
  quizAnswered = false;
  document.getElementById('nextQuizBtn').style.opacity = '0.5';

  const type = QUIZ_TYPES[Math.floor(Math.random()*QUIZ_TYPES.length)];
  const correctIdx = Math.floor(Math.random()*26);
  const correct = LETTERS[correctIdx];

  // Build 4 options (1 correct + 3 random)
  const opts = new Set([correctIdx]);
  while(opts.size < 4) opts.add(Math.floor(Math.random()*26));
  const shuffled = [...opts].sort(()=>Math.random()-.5);

  currentQuiz = { type, correctIdx, correct };

  const promptEl = document.getElementById('quizPrompt');
  const letterEl = document.getElementById('quizLetter');
  const emojiEl  = document.getElementById('quizEmoji');
  const soundBtn = document.getElementById('quizSoundBtn');

  letterEl.style.display = 'none';
  soundBtn.style.display = 'flex';

  if(type === 'hear-choose-letter'){
    promptEl.textContent = '🎧 Listen and choose the correct letter!';
    emojiEl.textContent = correct.emoji;
    soundBtn.style.display = 'flex';
    setTimeout(()=>playQuizSound(), 300);
    document.getElementById('quizOptions').innerHTML = shuffled.map(i=>`
      <button class="quiz-opt" onclick="checkQuiz(${i},${correctIdx},this)">
        ${LETTERS[i].l}
      </button>`).join('');

  } else if(type === 'see-letter-choose-word'){
    promptEl.textContent = '👀 What word starts with this letter?';
    letterEl.style.display = 'block';
    letterEl.textContent = correct.l;
    letterEl.style.color = correct.color[0];
    emojiEl.textContent = '';
    soundBtn.style.display = 'none';
    document.getElementById('quizOptions').innerHTML = shuffled.map(i=>`
      <button class="quiz-opt" onclick="checkQuiz(${i},${correctIdx},this)" style="font-size:clamp(1rem,4vw,1.3rem)">
        ${LETTERS[i].emoji} ${LETTERS[i].word}
      </button>`).join('');

  } else {
    promptEl.textContent = '🖼️ What letter does this picture start with?';
    emojiEl.textContent = correct.emoji;
    soundBtn.style.display = 'none';
    document.getElementById('quizOptions').innerHTML = shuffled.map(i=>`
      <button class="quiz-opt" onclick="checkQuiz(${i},${correctIdx},this)">
        ${LETTERS[i].l}
      </button>`).join('');
  }
}

function playQuizSound(){
  if(!currentQuiz) return;
  speak(currentQuiz.correct.word, 0.85, 1.1);
}

function checkQuiz(chosen, correct, el){
  if(quizAnswered) return;
  quizAnswered = true;
  quizTotal++;
  document.getElementById('nextQuizBtn').style.opacity = '1';

  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach(o => o.style.pointerEvents = 'none');

  if(chosen === correct){
    quizScore++; quizStreak++;
    el.classList.add('correct');
    speak('Excellent! ' + LETTERS[correct].word, 0.9, 1.2);
    showToast('🌟 Correct! Well done!', 'correct-toast');
  } else {
    quizStreak = 0;
    el.classList.add('wrong');
    opts.forEach(o => {
      if(parseInt(o.getAttribute('onclick').match(/checkQuiz\((\d+)/)?.[1]) === correct)
        o.classList.add('correct');
    });
    speak('The answer is ' + LETTERS[correct].l + '. ' + LETTERS[correct].word, 0.85, 1);
    showToast('❌ Try again next time!', 'wrong-toast');
  }

  document.getElementById('qScore').textContent = quizScore;
  document.getElementById('qTotal').textContent = quizTotal;
  document.getElementById('qStreak').textContent = quizStreak;
}

// ── TOAST ──
function showToast(msg, cls=''){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + cls;
  setTimeout(()=>t.className='toast', 2200);
}

// ── INIT ──
buildGrid();
updateDisplay();

// iOS fix: resume AudioContext on first touch
document.addEventListener('touchstart', ()=>{ synth?.cancel(); }, {once:true, passive:true});
</script>
</body>
</html>
